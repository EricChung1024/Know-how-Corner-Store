<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考核系統｜登入｜巷口服務所</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<main class="login-page">
  <div class="brand-hero"><span id="logo"></span><div><div class="wordmark">巷口服務所</div><p class="cap">歡迎光臨</p></div></div>
  <h1>考核系統</h1>
  <div id="setup"></div>
  <form id="login" class="card panel" style="width:100%;max-width:440px" novalidate>
    <label for="email">信箱</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div id="msg" aria-live="polite"></div>
    <p><button class="btn" type="submit" id="go">登入</button></p>
    <p class="muted">帳號由主管建立，沒有自助註冊。忘記密碼請洽主管重設。</p>
  </form>
</main>
<script type="module">
import { isConfigured } from './js/config.js';
import { h, brandMark, renderFooter } from './js/ui.js';

document.getElementById('logo').append(brandMark(64));
renderFooter();

const msg = document.getElementById('msg');
if (!isConfigured()) {
  document.getElementById('setup').append(h('div', { class: 'notice warn' },
    '尚未設定 Supabase：請編輯 js/config.js，填入專案網址與 anon key。'));
  document.getElementById('go').disabled = true;
} else {
  const { signIn, getMe } = await import('./js/api.js');
  const { homeOf } = await import('./js/guard.js');
  try { const me = await getMe(); if (me) location.replace(homeOf(me.role)); } catch { /* 沒登入就留在這頁 */ }
  document.getElementById('login').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const btn = document.getElementById('go');
    btn.disabled = true; msg.replaceChildren();
    try {
      await signIn(document.getElementById('email').value.trim(), document.getElementById('password').value);
      const me = await getMe();
      location.replace(homeOf(me.role));
    } catch (e) {
      msg.replaceChildren(h('div', { class: 'notice error', role: 'alert' }, e.code === 'INVALID_LOGIN' ? e.message : '登入失敗，請稍後再試'));
      btn.disabled = false;
    }
  });
}
</script>
</body>
</html>
