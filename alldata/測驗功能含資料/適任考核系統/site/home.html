<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考核系統｜首頁｜巷口服務所</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <p class="cap">第 1 格・考核大廳</p>
  <h1>我的考核</h1>
  <div id="app"></div>
</main>
<script type="module">
import { requireRole } from './js/guard.js';
import { renderNav, h, showError, setBusy } from './js/ui.js';
import { select } from './js/api.js';
import { stageLabel, statusOf, dueStatus } from './js/format.js';

const me = await requireRole('employee');
renderNav(me, 'home.html');
const app = document.getElementById('app');
setBusy(app);
try {
  const [rows, cfgRows, statusRows] = await Promise.all([
    select('v_stage_summary', { columns: 'stage, best_score, attempts, passed' }),
    select('v_assessments', { columns: 'stage, total_questions, pass_score' }),
    select('v_assessment_status', { columns: 'hire_date, probation_due, probation_passed_at, semiannual_due' }),
  ]);
  const by = new Map(rows.map((r) => [r.stage, r]));
  const cfg = new Map(cfgRows.map((c) => [c.stage, c]));
  const st = statusRows[0] || {};
  const card = (stage, due) => {
    const s = by.get(stage);
    const c = cfg.get(stage);
    const cls = !s ? 'none' : s.passed ? 'ok' : 'bad';
    return h('div', { class: 'card stage-card', 'data-stage': stage },
      h('h2', { style: 'margin-top:0' }, stageLabel(stage)),
      h('p', {}, h('span', { class: `badge ${cls}` }, statusOf(s))),
      h('p', { class: 'muted' }, `${c ? `${c.total_questions} 題・${c.pass_score} 分及格・` : ''}${s ? `最高 ${s.best_score} 分・已考 ${s.attempts} 次` : '尚未考過'}`),
      due ? h('p', { class: `due ${due.level}` }, due.label) : null,
      h('a', { class: 'btn', href: `exam.html?stage=${stage}` }, s ? '再考一次' : '開始考試'));
  };
  const probationDue = dueStatus(st.probation_due, !!st.probation_passed_at);
  const semiDue = dueStatus(st.semiannual_due, false);
  app.replaceChildren(
    h('h2', {}, '正式考核'),
    h('p', { class: 'muted' }, '試用期考核在試用期內完成；通過後每半年要再考一次「半年考核」。到職日由主管設定。'),
    h('div', { class: 'grid', id: 'formal' }, card(10, probationDue), card(11, semiDue)),
    h('h2', {}, '章節考核'),
    h('p', { class: 'muted' }, '每個階段都可以重考，及格分數 80 分。'),
    h('div', { class: 'grid' }, [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map((s) => card(s))));
} catch (e) { showError(app, e); }
</script>
</body>
</html>
