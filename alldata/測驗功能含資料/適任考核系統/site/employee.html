<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考核系統｜員工詳情｜巷口服務所</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <p><a href="supervisor.html">← 回員工總覽</a></p>
  <p class="cap">第 2 格・員工詳情</p>
  <h1 id="title">員工詳情</h1>
  <div id="msg" aria-live="polite"></div>
  <div id="app"></div>
</main>
<script type="module">
import { requireRole } from './js/guard.js';
import { renderNav, h, showError, setBusy } from './js/ui.js';
import { select, rpc, callFn } from './js/api.js';
import { stageLabel, fmtDate, errorTypeCounts, dueStatus } from './js/format.js';
import { renderErrorBars } from './js/report.js';

const me = await requireRole('supervisor');
renderNav(me, 'supervisor.html');
const app = document.getElementById('app');
const msg = document.getElementById('msg');
const uid = new URLSearchParams(location.search).get('id');

async function load() {
  setBusy(app);
  try {
    const [prof, attempts, errs, detail, statusRows] = await Promise.all([
      select('profiles', { columns: 'id, name', eq: { id: uid } }),
      select('attempts', { columns: 'id, stage, score, passed, submitted_at', eq: { user_id: uid, status: 'done' }, order: ['submitted_at', 'desc'] }),
      select('v_error_counts', { columns: 'error_type, cnt', eq: { user_id: uid } }),
      rpc('get_employee_detail', { p_user: uid }),
      select('v_assessment_status', { columns: 'hire_date, probation_due, probation_passed_at, semiannual_due', eq: { user_id: uid } }),
    ]);
    const st = statusRows[0] || {};
    const pDue = dueStatus(st.probation_due, !!st.probation_passed_at);
    const sDue = dueStatus(st.semiannual_due, false);
    const hire = h('input', { type: 'date', id: 'hire-date', value: st.hire_date || '', 'aria-label': '到職日', style: 'width:12rem' });
    const saveHire = h('button', { class: 'btn', id: 'save-hire', onclick: async () => {
      try {
        await rpc('set_hire_date', { p_user: uid, p_date: hire.value || null });
        await load();
        msg.replaceChildren(h('p', { class: 'notice ok' }, '已儲存到職日。'));
      } catch (e) { showError(msg, e); }
    } }, '儲存到職日');
    if (!prof.length) { showError(app, new Error('找不到這位員工')); return; }
    document.getElementById('title').textContent = `${prof[0].name} 的考核狀況`;

    const shortCard = (s) => {
      const input = h('input', { type: 'number', class: 'adjust', min: 0, max: 1, step: 0.05, value: s.points ?? 0, 'aria-label': '調整分數（0 到 1）', style: 'width:8rem' });
      return h('article', { class: 'card short-answer', 'data-qid': s.question_id, 'data-attempt': s.attempt_id, style: 'margin-bottom:12px' },
        h('p', { class: 'muted' }, `交卷時間 ${fmtDate(s.submitted_at)}`),
        h('p', { class: 'stem' }, s.stem),
        h('p', { class: 'muted' }, '員工作答：'), h('p', { class: 'stem' }, s.text_answer || '（未作答）'),
        h('p', { class: 'muted' }, '參考答案：'), h('p', { class: 'stem' }, s.reference_answer),
        h('p', { class: 'muted' }, `得分點：${(s.rubric || []).map((r, i) => `${(s.checked || []).includes(i) ? '☑' : '☐'} ${r}`).join('；')}`),
        h('div', { class: 'row' }, h('span', {}, '本題得分（0–1）：'), input,
          h('button', { class: 'btn adjust-btn', onclick: async () => {
            try { await rpc('adjust_short_score', { p_attempt: s.attempt_id, p_question: s.question_id, p_points: Number(input.value) }); msg.replaceChildren(); await load(); }
            catch (e) { showError(msg, e); }
          } }, '調整分數')));
    };

    app.replaceChildren(
      h('h2', {}, '到職日與考核期限'),
      h('div', { class: 'row' }, h('label', { for: 'hire-date', style: 'margin:0' }, '到職日'), hire, saveHire),
      h('div', { class: 'formal-status' },
        h('p', { class: `due ${pDue.level}` }, `試用期考核：${pDue.label}`),
        h('p', { class: `due ${sDue.level}` }, `半年考核：${sDue.label}`),
        h('p', { class: 'muted' }, `期限日期：試用期 ${st.probation_due || '—'}（到職日＋3 個月）・半年考核 ${st.semiannual_due || '—'}`)),
      h('h2', {}, '帳號'),
      h('div', { class: 'row' }, h('button', { class: 'btn ghost', id: 'reset-pw', onclick: async () => {
        if (!confirm('確定要重設這位員工的密碼嗎？舊密碼會立刻失效。')) return;
        try {
          const r = await callFn('create-employees', { action: 'reset_password', user_id: uid });
          msg.replaceChildren(h('div', { class: 'notice ok' }, '新的初始密碼（只會顯示這一次）：', h('code', { class: 'new-password', style: 'font-size:1.1rem' }, r.password)));
        } catch (e) { showError(msg, e); }
      } }, '重設密碼')),
      h('h2', {}, '歷次成績'),
      attempts.length
        ? h('table', { class: 'attempts' },
            h('thead', {}, h('tr', {}, ['階段', '交卷時間', '分數', '結果'].map((t) => h('th', {}, t)))),
            h('tbody', {}, attempts.map((a) => h('tr', {},
              h('td', {}, stageLabel(a.stage)), h('td', {}, fmtDate(a.submitted_at)), h('td', {}, String(a.score)),
              h('td', { class: a.passed ? 'cell-ok' : 'cell-bad' }, a.passed ? '已通過' : '未通過')))))
        : h('p', { class: 'muted' }, '還沒有考試紀錄。'),
      h('h2', {}, '錯誤類型分布'),
      renderErrorBars(errorTypeCounts(errs)),
      h('h2', {}, '錯題區概況'),
      h('p', {}, h('span', { id: 'open-count', class: 'badge bad' }, `未掌握 ${detail.open_count} 題`), '　',
        h('span', { id: 'mastered-count', class: 'badge ok' }, `已掌握 ${detail.mastered_count} 題`)),
      h('h3', {}, '常錯題（前 10）'),
      detail.wrong.length
        ? h('ol', {}, detail.wrong.map((w) => h('li', { class: 'wrong-row' },
            `${stageLabel(w.stage)}｜${w.stem.replace(/\s+/g, ' ').slice(0, 50)}｜${w.error_type || '—'}｜答錯 ${w.wrong_count} 次（${w.status === 'mastered' ? '已掌握' : '未掌握'}）`)))
        : h('p', { class: 'muted' }, '沒有錯題紀錄。'),
      h('h2', {}, '情境簡答作答（可覆核調分）'),
      detail.short_answers.length ? h('div', {}, detail.short_answers.map(shortCard)) : h('p', { class: 'muted' }, '沒有簡答作答。'));
  } catch (e) { showError(app, e); }
}
await load();
</script>
</body>
</html>
