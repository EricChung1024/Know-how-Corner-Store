<title>好物集 SOP 關聯圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：上方工具列＋左圖右資訊欄；巷口服務所色票（奶茶底、陶土紅、鵝黃），單一淺色主題 */
:root{
  --latte:#F3E3CC;--paper:#FFF6E6;--white:#FFFFFF;--terra:#B8452F;--terra-l:#D9806A;--terra-t:#F2D3C4;
  --gold:#FFC94A;--gold-l:#FFE7A3;--gold-t:#FFF0C2;--ink:#2B1E16;--ink-m:#5C4636;--ok-ink:#7A5A12;--line:#CDB797;--latte-d:#E6CFAE;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--latte);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--terra);font-weight:700}
h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.sub{color:var(--ink-m);margin:0;max-width:62ch}
.note{display:inline-block;font-size:12px;color:var(--ink-m);background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:2px 8px}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 16px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--gold)}
.tab:focus-visible,.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.toolbar input,.toolbar select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--white);color:var(--ink);min-width:0}
.toolbar input{flex:1 1 200px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--white);color:var(--ink-m);border-radius:999px;padding:3px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:10px;height:10px;border-radius:3px;border:1px solid var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:700}
.chip[aria-pressed="false"] .dot{opacity:.3}
.btn{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--gold);color:var(--ink);border-radius:10px;padding:5px 12px;cursor:pointer}
.btn.ghost{background:var(--white)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
@media (max-width:900px){.main{grid-template-columns:1fr}}
#cy{height:72vh;min-height:420px;background:var(--white);border:3px solid var(--ink);border-radius:18px}
aside{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0;max-height:72vh;overflow:auto}
aside h2{font-family:var(--display);font-weight:400;font-size:22px;margin:4px 0 6px;line-height:1.3}
.type{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;display:inline-block;border:1px solid var(--ink)}
.info{margin:8px 0;white-space:pre-wrap}
.meta{font-size:13px;color:var(--ink-m)}
.rel h3{font-size:13px;color:var(--terra);margin:14px 0 4px;letter-spacing:.04em}
.rel ul{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.rel li button{font:inherit;font-size:14px;text-align:left;width:100%;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;color:var(--ink)}
.rel li small{color:var(--ink-m)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums}
#tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tcard.ext{background:var(--gold-t);border-style:dashed;border-color:var(--ink-m)}
.tcard h3{margin:0;font-size:17px}
.tcard code{font-size:12px;color:var(--ink-m)}
.tcard p{margin:4px 0 8px;color:var(--ink-m);font-size:13px}
.tcard ul{margin:0;padding-left:18px;font-size:13px}
.fk{color:var(--terra);font-weight:700}
.legend{font-size:13px;color:var(--ink-m);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">巷口服務所｜SOP 資料統整</div>
      <h1>好物集 SOP 關聯圖</h1>
      <p class="sub">9 個工作步驟、57 條規則，和它們的來源檔、教學證據、經驗談、系統功能、法規、問答案例怎麼連在一起。點任一個點看細節；黃色虛線是留給組員延伸的位置。</p>
      <span class="note">示範資料：好物集為虛構公司</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-tab="graph">關聯動態圖</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="db">資料表（關聯資料庫）</button>
    </div>
  </header>

  <section id="v-graph">
    <div class="toolbar">
      <input id="q" type="search" placeholder="搜尋：例如 退款、7-9、鑑賞期、佩珊" aria-label="搜尋節點">
      <select id="ch" aria-label="只看某一步"><option value="">全部步驟</option></select>
      <button class="btn ghost" id="relayout" type="button">排回原位</button>
      <button class="btn ghost" id="fit" type="button">看全部</button>
      <div class="chips" id="filters" aria-label="顯示哪些類型"></div>
    </div>
    <div class="main">
      <div id="cy" role="img" aria-label="SOP 關聯動態圖"></div>
      <aside id="panel" aria-live="polite"></aside>
    </div>
    <p class="legend">規則：粗紅框＝★紅線｜鵝黃底＝統整時資深逐題確認過｜灰色虛框＝已失效。來源連線：實線＝寫法和最新版一致｜虛線＝已被取代｜紅虛線＝與法規不符。</p>
  </section>

  <section id="v-db" hidden>
    <p class="sub" style="margin-bottom:12px">每張卡＝一張資料表（也就是 Excel《關聯資料庫》的一個工作表）。<span class="fk">紅字欄位</span>是用來連到別張表的代碼。黃底虛框的四張是留給組員延伸的表，只要填上規則代碼或步驟編號，就會接進同一張關聯圖。</p>
    <div id="tables"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const GRAPH = {"nodes": [{"id": "CH1", "label": "第 1 步 上工前準備", "type": "步驟", "info": "開始接客人之前要知道的系統、檔案與服務時間"}, {"id": "CH2", "label": "第 2 步 接起對話", "type": "步驟", "info": "客人一進來：多快回、怎麼驗證身分、哪些資料絕對不能問"}, {"id": "CH3", "label": "第 3 步 回答商品問題", "type": "步驟", "info": "客人還沒買：規格、補貨、缺貨、成分與採購"}, {"id": "CH4", "label": "第 4 步 優惠與活動", "type": "步驟", "info": "客人下單時：優惠券和活動限制"}, {"id": "CH5", "label": "第 5 步 訂單、付款與發票", "type": "步驟", "info": "客人下單後：取消、改地址、發票、扣款"}, {"id": "CH6", "label": "第 6 步 配送與物流", "type": "步驟", "info": "商品寄出後：超商取貨、延遲、沒收到、破損"}, {"id": "CH7", "label": "第 7 步 退換貨與退款", "type": "步驟", "info": "客人收到後想退：鑑賞期、能不能退、運費、退款"}, {"id": "CH8", "label": "第 8 步 客訴、補償與特殊狀況", "type": "步驟", "info": "客人不滿意或狀況特殊：找主管、補償、升級、詐騙、個資"}, {"id": "CH9", "label": "第 9 步 結案與交接", "type": "步驟", "info": "處理完：工單狀態、結案代碼、外撥、交接"}, {"id": "G01", "label": "1-3 服務時間與渠道", "type": "規則", "red": false, "expired": false, "info": "每日 09:00–21:00；渠道為 LINE 官方帳號、站內訊息、客服電話、Email。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次沿用（教學沒提、舊檔一致）", "asked": false}, {"id": "G02", "label": "2-2 身分驗證", "type": "規則", "red": true, "expired": false, "info": "說明任何訂單細節前，須核對「訂單編號＋手機末 3 碼＋收件人姓氏」三項皆正確；任一不符就不能透露訂單內容。", "meta": "生效 2025-08-12｜依據 LINE 群組 2025/08/12 主管公告｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "G03", "label": "2-3 禁止索取的資料", "type": "規則", "red": true, "expired": false, "info": "不可索取：完整卡號、卡片背面末 3 碼、密碼、簡訊驗證碼（OTP）、身分證字號；客戶主動貼出時，提醒「我們不會索取這些資料」，並在好物工單按「遮蔽」。", "meta": "生效 2025-10-08｜依據 2024 檢核表＋2025 佩珊小抄，遮蔽為教學新增｜批次確認（教學新增）", "asked": false}, {"id": "G04", "label": "2-1 首次回覆時限", "type": "規則", "red": false, "expired": false, "info": "LINE：60 秒內回覆第一句（可先用罐頭訊息）；站內訊息：30 分鐘；客服電話：響 3 聲內接聽；Email：營運時間內 4 小時。大促期間依當次主管公告。", "meta": "生效 2025-10-08｜依據 2024 檢核表＋2025 佩珊小抄，經林佩珊確認｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "G05", "label": "（已失效）雙 11 大促 LINE 首回放寬（暫時規則）", "type": "規則", "red": false, "expired": true, "info": "2026/11/01–11/15 大促期間 LINE 首次回覆放寬為 3 分鐘；11/16 起恢復 60 秒。", "meta": "已失效｜到期 2026-11-15", "asked": false}, {"id": "G06", "label": "1-1 工單系統", "type": "規則", "red": false, "expired": false, "info": "一律在「好物工單」開單與記錄；2025 年 6 月以前的舊案件到「客服通」查詢，只能看不能改。", "meta": "生效 2025-07-01｜依據 LINE 群組 2025/06/20 主管公告｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "G07", "label": "1-2 檔案位置", "type": "規則", "red": false, "expired": false, "info": "所有檔案在好物雲端「客服部」資料夾（https://drive.haowu.example/cs）；舊文件裡寫的 NAS 路徑（\\\\haowu-nas01）已經打不開，請查雲端「00_說明」裡的《檔案位置對照表》。", "meta": "生效 2025-03-10｜依據 LINE 群組 2025/03/10＋檔案位置對照表｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "G08", "label": "9-3 外撥話術", "type": "規則", "red": false, "expired": false, "info": "外撥（主動致電客戶）一律使用好物工單內建的「外撥範本」；舊的《外撥話術.docx》停用。", "meta": "生效 2025-07-01｜依據 林佩珊於統整時確認（舊檔遺失）｜逐題確認", "asked": true}, {"id": "G09", "label": "9-1 工單狀態與「等待客戶」", "type": "規則", "red": false, "expired": false, "info": "工單狀態：新建／處理中／等待客戶／等待物流商／已升級／已結案；「等待客戶」超過 3 天未回，結案前須發最後一次通知。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜自動確認（教學與舊檔一致）", "asked": false}, {"id": "G10", "label": "9-2 結案代碼", "type": "規則", "red": false, "expired": false, "info": "好物工單結案代碼：R1 已解決／R2 待追蹤／R3 轉單位／R4 顧客未回應／R5 疑似詐騙。", "meta": "生效 2025-07-01｜依據 2025 佩珊小抄＋好物工單畫面｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "G11", "label": "2-4 承諾一定附時間", "type": "規則", "red": false, "expired": false, "info": "說「我幫您查」時一定要給明確回覆時間（例：今天 18:00 前回覆您）；不說「馬上」「一定」「絕對」。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜自動確認（教學與舊檔一致）", "asked": false}, {"id": "G12", "label": "8-9 防詐騙", "type": "規則", "red": true, "expired": false, "info": "客戶反映接到「解除分期／重複扣款／訂單設定錯誤」電話：明確告知我們不會要求操作 ATM、網銀或購買點數；請客戶掛斷並撥 165；好物工單加「疑似詐騙」標籤、結案代碼 R5，並通報資安窗口。", "meta": "生效 2025-09-01｜依據 LINE 群組 2025/09/01＋2025 佩珊小抄｜自動確認（教學與舊檔一致）", "asked": false}, {"id": "G13", "label": "8-10 個資請求（查閱、刪除、停止行銷）", "type": "規則", "red": true, "expired": false, "info": "客戶要求查閱／刪除個資、刪除帳號或停止行銷：不在對話中處理，請客戶到「會員中心 > 隱私權設定」提出申請（系統自動轉法務）；客戶無法操作時開單轉法務（R3）。", "meta": "生效 2026-11-16｜依據 林佩珊於統整時確認（舊版只有 2022 版）｜逐題確認", "asked": true}, {"id": "A01", "label": "3-1 商品資訊只依商品頁", "type": "規則", "red": false, "expired": false, "info": "商品規格只依商品頁與後台規格表回答；規格表沒  false, "info": "生鮮、易腐商品物流異常須當日處理，並升級二線。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次沿用（教學沒提、舊檔一致）", "asked": false}, {"id": "C07", "label": "6-7 30 天內第 2 次物流異常", "type": "規則", "red": false, "expired": false, "info": "同一客戶 30 天內第 2 次物流異常，升級二線。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次沿用（教學沒提、舊檔一致）", "asked": false}, {"id": "D01", "label": "7-1 7 天鑑賞期怎麼算", "type": "規則", "red": true, "expired": false, "info": "7 天鑑賞期從「到貨（宅配簽收）或超商取件的隔天」起算 7 天，不是下單日。", "meta": "生效 2025-10-08｜依據 2025 佩珊小抄＋消保法第 19 條｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "D02", "label": "7-2 拆封商品", "type": "規則", "red": true, "expired": false, "info": "拆封仍須受理退貨，不可以「已拆封」直接拒絕；包裝不完整也要收，在好物工單註記狀況，由倉庫驗收評估。", "meta": "生效 2025-10-08｜依據 2025 佩珊小抄＋消保法｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "D03", "label": "7-3 例外商品", "type": "規則", "red": true, "expired": false, "info": "生鮮、客製化、拆封的貼身衣物或個人衛生用品、拆封的影音軟體：須商品頁「事先標示」不適用鑑賞期才能拒絕；未標示者升級二線，原則上受理。", "meta": "生效 2025-10-08｜依據 2025 佩珊小抄＋合理例外情事適用準則｜自動確認（教學與舊檔一致）", "asked": false}, {"id": "D04", "label": "7-4 「客製化」不等於「選了規格」", "type": "規則", "red": true, "expired": false, "info": "從現有顏色、尺寸選購不算客製化，不可以「客製化」為由拒退。", "meta": "生效 2026-11-03｜依據 林佩珊教學（舊版沒有）｜批次確認（教學新增）", "asked": false}, {"id": "D05", "label": "7-7 退貨運費", "type": "規則", "red": false, "expired": false, "info": "7 天內退貨，以及商品瑕疵、寄錯，退貨運費都由公司負擔。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "D06", "label": "7-6 簽收 8–14 天換貨", "type": "規則", "red": false, "expired": false, "info": "簽收 8–14 天內、未拆封且包裝完整可換貨，運費由客戶負擔，不退現金。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次沿用（教學沒提、舊檔一致）", "asked": false}, {"id": "D07", "label": "7-5 明顯使用痕跡", "type": "規則", "red": false, "expired": false, "info": "一線不可自行扣款或拒退：請客戶拍照，轉二線評估；是否酌收整新費、收多少，由二線決定。", "meta": "生效 2026-11-16｜依據 林佩珊於統整時確認｜逐題確認", "asked": true}, {"id": "D08", "label": "7-9 退款時程", "type": "規則", "red": false, "expired": false, "info": "倉庫驗收完成後 3 個工作日內發起退款；信用卡另需發卡銀行約 5–14 個工作日，不保證入帳日。發起當天主動通知客戶。", "meta": "生效 2026-01-15｜依據 LINE 群組 2026/01/12 財務公告｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "D09", "label": "7-11 ATM／貨到付款的退款帳戶", "type": "規則", "red": true, "expired": false, "info": "請客戶到「會員中心 > 退款帳戶」自行填寫；不可在對話、電話中索取或記錄銀行帳號。", "meta": "生效 2025-07-01｜依據 LINE 群組 2025/07/01 主管公告＋2025 佩珊小抄｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "D10", "label": "7-10 退款方式", "type": "規則", "red": false, "expired": false, "info": "一律原付款方式退回；不可主動建議改成購物金，購物金只能是客戶自己選。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜自動確認（教學與舊檔一致）", "asked": false}, {"id": "D11", "label": "7-8 退貨未入倉不先退款", "type": "規則", "red": false, "expired": false, "info": "退貨尚未由物流取回或入倉驗收，不先退款；告知客戶預計入倉日。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次沿用（教學沒提、舊檔一致）", "asked": false}, {"id": "D12", "label": "7-12 部分退貨的優惠分攤", "type": "規則", "red": false, "expired": false, "info": "部分退貨依商品金額比例分攤優惠，先把金額算給客戶看再說明；無法判斷轉二線。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次沿用（教學沒提、舊檔一致）", "asked": false}, {"id": "E01", "label": "4-1 優惠券無法使用", "type": "規則", "red": false, "expired": false, "info": "先逐項查門檻、效期、品類限制、是否已使用、可否併用，再向客戶說明；不直接補發。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜自動確認（教學與舊檔一致）", "asked": false}, {"id": "E02", "label": "4-2 過期優惠券", "type": "規則", "red": false, "expired": false, "info": "過期券不延期、不補發；因公司系統錯誤造成者，由二線評估。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜自動確認（教學與舊檔一致）", "asked": false}, {"id": "E03", "label": "（已失效）雙 11 延遲出貨 50 元購物金（2025 活動限定）", "type": "規則", "red": false, "expired": true, "info": "2025 雙 11 延遲出貨補償 50 元購物金，僅限 2025 年活動；2026 雙 11 不統一發放，改依 8-3 補償權限處理。", "meta": "已失效｜到期 2025-12-31", "asked": false}, {"id": "E04", "label": "4-3 活動限制要主動說明", "type": "規則", "red": false, "expired": false, "info": "活動商品不接受取消、優惠券不可併用等限制，須在受理時主動說明。", "meta": "生效 2024-05-20｜依據 2024 檢核表｜批次沿用（教學沒提、舊檔一致）", "asked": false}, {"id": "F01", "label": "8-3 補償權限", "type": "規則", "red": false, "expired": false, "info": "一線可直接發放 100 元以內購物金（限物流延遲、缺貨）；101–500 元由組長核准；500 元以上由主管核准；一律在好物工單「補償申請」送出。", "meta": "生效 2026-03-02｜依據 LINE 群組 2026/02/26 主管公告｜批次確認（教學與最新的舊檔一致）", "asked": false}, {"id": "F02", "label": "8-4 一線升級二線的條件", "type": "規則", "red": false, "expi function applyFilters(){
  cy.batch(() => {
    cy.nodes().forEach(n => {
      let show = state.types[n.data("type")];
      if (show && state.ch) {
        const chId = "CH" + state.ch;
        if (n.data("type") === "步驟") show = n.id() === chId;
        else if (n.data("type") === "規則") show = n.connectedEdges().some(e => e.source().id() === chId);
        else show = n.neighborhood('node[type="規則"]').some(r => r.connectedEdges().some(e => e.source().id() === chId));
      }
      n.style("display", show ? "element" : "none");
    });
  });
}
function layout(){
  // 分群排列：9 個步驟排成大圓，規則圍著自己的步驟；其他點放在它連到的規則外側
  const pos = {}, chs = cy.nodes('[type="步驟"]'), R = 1050;
  chs.forEach((c, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / chs.length; pos[c.id()] = {x: R * Math.cos(a), y: R * Math.sin(a)}; });
  chs.forEach(c => {
    const rs = c.outgoers('node[type="規則"]'), n = rs.length, cp = pos[c.id()], rad = Math.max(170, n * 24);
    rs.forEach((r, j) => { const a = -Math.PI / 2 + j * 2 * Math.PI / n; pos[r.id()] = {x: cp.x + rad * Math.cos(a), y: cp.y + rad * Math.sin(a), ch: c.id()}; });
  });
  const others = cy.nodes().filter(n => !pos[n.id()]);
  const inner = [], used = {};
  others.forEach(n => {
    const nb = n.neighborhood("node").filter(m => pos[m.id()] && m.data("type") !== "步驟");
    if (nb.length === 1) {
      const r = pos[nb[0].id()], c = pos[r.ch] || {x: 0, y: 0};
      let dx = r.x - c.x, dy = r.y - c.y; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const k = used[nb[0].id()] = (used[nb[0].id()] || 0) + 1;
      pos[n.id()] = {x: r.x + dx * (95 + 55 * (k - 1)) - dy * 20 * (k - 1), y: r.y + dy * (95 + 55 * (k - 1)) + dx * 20 * (k - 1)};
    } else inner.push(n);
  });
  // 連到很多規則的點（來源檔、系統功能、人物、待延伸…）放在中間的圓上，依它們連到的方向排
  const ang = n => { const nb = n.neighborhood("node").filter(m => pos[m.id()]); let x = 0, y = 0; nb.forEach(m => { x += pos[m.id()].x; y += pos[m.id()].y; }); return Math.atan2(y, x || 0.0001); };
  inner.sort((a, b) => ang(a) - ang(b)).forEach((n, i) => {
    const ring = i % 2, a = -Math.PI / 2 + i * 2 * Math.PI / inner.length;
    pos[n.id()] = {x: (330 + ring * 150) * Math.cos(a), y: (330 + ring * 150) * Math.sin(a)};
  });
  cy.layout({name: "preset", positions: n => pos[n.id()], fit: false}).run();
  cy.fit(cy.elements(":visible"), 24);
}

  panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const m = cy.getElementById(b.dataset.go);
    if (m.style("display") === "none") { state.types[m.data("type")] = true; fbox.children[Object.keys(TYPES).indexOf(m.data("type"))].setAttribute("aria-pressed","true"); applyFilters(); }
    cy.$(":selected").unselect(); m.select(); focusNode(m);
  });
}
cy.on("tap", "node", e => focusNode(e.target));
cy.on("tap", e => { if (e.target === cy) { clearFocus(); showOverview(); } });
document.getElementById("q").addEventListener("input", e => {
  const s = e.target.value.trim(); cy.nodes().removeClass("hit");
  if (!s) return;
  const hits = cy.nodes(":visible").filter(n => (n.data("label")+n.data("info")+(n.data("meta")||"")).includes(s));
  hits.addClass("hit");
  if (hits.length) cy.animate({fit:{eles:hits, padding:60}, duration:250});
});
