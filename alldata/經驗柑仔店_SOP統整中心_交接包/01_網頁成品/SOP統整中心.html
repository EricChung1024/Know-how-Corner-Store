<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>經驗柑仔店 Know-how Corner Store</title>
<!-- 字型：粉圓體（標題）＋思源黑體（內文） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* style.css｜經驗柑仔店視覺樣式：色彩與字體 tokens、按鈕、面板、小橘、進度路、分類標籤、版面 */
/* 視覺沿用小組的 Design System v2（原「巷口服務所」設計系統）：奶茶底＋陶土紅＋鵝黃；粉圓體標題＋思源黑體內文；只有主要面板用粗框＋貼紙偏移陰影；一頁由上往下一格一格讀 */
:root{
  --latte:#F3E3CC;--latte-deep:#E6CFAE;--paper:#FFF6E6;--white:#FFFFFF;
  --terracotta:#B8452F;--terracotta-light:#D9806A;--terracotta-tint:#F2D3C4;
  --gold:#FFC94A;--gold-light:#FFE7A3;--gold-tint:#FFF0C2;
  --ink:#2B1E16;--ink-muted:#5C4636;--ok-ink:#7A5A12;--line:#CDB797;--disabled:#E3D5C2;--xiaoju-line:#B8703E;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r-xs:6px;--r-sm:10px;--r-lg:14px;--r-xl:22px;--r-pill:999px;
  --sticker-sm:4px 4px 0 var(--ink);--sticker:6px 6px 0 var(--ink);--sticker-lg:9px 9px 0 var(--ink);
  --dur-base:.2s;--dur-pop:.32s;--dur-flip:.5s;--dur-stamp:.45s;--dur-wag:2.4s;
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);--ease-flip:cubic-bezier(.2,.8,.2,1);--ease-stamp:cubic-bezier(.2,1.6,.4,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--latte)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:26px;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:36px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:42px;line-height:52px}h2{font-size:26px;line-height:34px}h3{font-size:20px;line-height:28px}
@media (max-width:600px){h1{font-size:30px;line-height:38px}}
.small{font-size:14px;line-height:22px}.muted{color:var(--ink-muted)}
.note{font-size:12px;line-height:18px;color:var(--ink-muted);text-align:center;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px}
.speed{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
:focus-visible{outline:4px solid var(--terracotta);outline-offset:2px}

/* Panel / Sheet / Caption */
.xk-panel{background:var(--white);border:3px solid var(--ink);border-radius:var(--r-xl);box-shadow:var(--sticker);padding:24px;min-width:0}
.xk-sheet{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0}
.xk-cap{display:inline-block;font-family:var(--display);font-size:15px;line-height:22px;background:var(--gold-light);border:2px solid var(--ink);border-radius:var(--r-xs);padding:2px 12px;margin-bottom:10px}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}

/* Button */
.xk-btn{font-family:var(--display);font-size:16px;line-height:24px;min-height:46px;padding:10px 20px;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:var(--sticker-sm);cursor:pointer;transition:transform var(--dur-base) var(--ease-bounce),box-shadow var(--dur-base) var(--ease-bounce);display:inline-flex;align-items:center;gap:6px}
.xk-btn:hover{transform:translateY(-2px);box-shadow:6px 6px 0 var(--ink)}
.xk-btn:active{transform:translate(4px,4px) scale(.96);box-shadow:none}
.xk-btn-ghost{font-family:var(--display);font-size:16px;line-height:24px;min-height:44px;padding:9px 18px;background:var(--white);color:var(--terracotta);border:1.5px solid var(--terracotta);border-radius:var(--r-lg);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.xk-btn:disabled,.xk-btn-ghost:disabled{background:var(--disabled);color:var(--ink-muted);border-color:var(--disabled);box-shadow:none;transform:none;cursor:not-allowed}
.xk-seg{justify-self:start;display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-pill);padding:4px}
.xk-seg button{font-family:var(--display);font-size:16px;min-height:44px;padding:8px 20px;border:2px solid transparent;background:transparent;color:var(--ink);border-radius:var(--r-pill);cursor:pointer}
.xk-seg button[aria-pressed="true"],.xk-seg button[aria-current="page"]{background:var(--gold);border-color:var(--ink)}

/* StatusChip */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:20px;font-weight:700;border-radius:var(--r-pill);padding:2px 10px;white-space:nowrap;border:1.5px solid transparent}
.chip.todo{background:var(--gold-light);color:var(--ink)}
.chip.doing{background:var(--paper);color:var(--ink);border:1.5px dashed var(--terracotta)}
.chip.done{background:var(--gold-tint);color:var(--ok-ink)}
.chip.warn{background:var(--terracotta-tint);color:var(--terracotta)}
.chip.role{background:var(--gold-light);color:var(--ink);border-color:var(--ink)}

/* SpeechBubble + 小橘 */
.say{display:flex;gap:12px;align-items:flex-end}
.say .cat{flex:none;width:76px}
.bubble{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-xl);border-bottom-left-radius:4px;padding:12px 16px;min-width:0;flex:1}
.bubble .who{font-family:var(--display);color:var(--terracotta);font-size:15px;line-height:22px}
.catbtn{background:none;border:0;padding:0;cursor:pointer}
.xiaoju{display:block;width:100%;height:auto;overflow:visible}
.xiaoju .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag var(--dur-wag) ease-in-out infinite}
.pop{animation:pop var(--dur-pop) var(--ease-bounce)}
@keyframes wag{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}

/* 漫畫格翻入、蓋章 */
.flip{animation:flip var(--dur-flip) var(--ease-flip) both;transform-origin:left center}
@keyframes flip{from{transform:perspective(1200px) rotateY(55deg);opacity:0}to{transform:none;opacity:1}}
.stamp{display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);color:var(--terracotta);border:3px solid var(--terracotta);border-radius:var(--r-sm);padding:2px 12px;transform:rotate(-12deg);background:var(--white)}
.stamp.go{animation:stamp var(--dur-stamp) var(--ease-stamp)}
@keyframes stamp{from{transform:scale(2.6) rotate(-24deg);opacity:0}to{transform:scale(1) rotate(-12deg);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* CatStepper（小橘帶路） */
.stepper{position:relative;padding-top:46px}
.stepper .road{position:relative;height:16px;border-radius:var(--r-pill);background:var(--latte-deep);border:2px solid var(--ink)}
.stepper .road::after{content:"";position:absolute;left:10px;right:10px;top:5px;border-top:2px dashed var(--paper)}
.stepper .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:var(--r-pill);transition:width .4s}
.stepper .rider{position:absolute;top:0;width:44px;margin-left:-22px;transition:left .4s}
.stepper .stops{display:grid;grid-template-columns:repeat(4,1fr);margin-top:4px;gap:4px}
.stepper .stop{font:inherit;background:none;border:0;border-radius:var(--r-sm);padding:4px 2px;min-height:44px;cursor:pointer;text-align:center;font-size:14px;line-height:20px;color:var(--ink-muted)}
.stepper .stop:hover:not(:disabled){background:var(--gold-tint)}
.stepper .stop:disabled{cursor:default;opacity:.5}
.stepper.flow{padding-top:40px}
.stepper.flow .rider{width:40px;margin-left:-20px;cursor:grab;touch-action:none;z-index:2}
.stepper.flow .rider.drag{transition:none;cursor:grabbing}
.stepper.flow .road{cursor:pointer;touch-action:none}
.stepper.read{padding-top:36px}
.stepper.read .rider{width:34px;margin-left:-17px}
.stepper .stop b{display:block;font-family:var(--display);font-weight:400;font-size:15px;color:var(--ink)}
.stepper .stop.on b{color:var(--terracotta)}

/* 店面（登入） */
.storefront{position:relative;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r-xl);overflow:hidden;padding:22px 22px 0}
.sign{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.street{display:flex;align-items:flex-end;gap:10px;height:128px;min-width:0}
.bld{position:relative;border:2.5px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0}
.bld.a{width:22%;height:100%;background:var(--terracotta-light)}
.bld.b{width:44%;height:84%;background:var(--gold)}
.bld.c{width:28%;height:64%;background:var(--latte)}
.awning{position:absolute;left:-6px;right:-6px;top:12px;height:20px;border:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--terracotta-light) 0 16px,var(--paper) 16px 32px)}
.door{position:absolute;bottom:0;left:50%;width:30px;height:44px;margin-left:-15px;background:var(--ink);border-radius:6px 6px 0 0}
.grille{position:absolute;left:18%;top:48px;width:56%;max-width:52px;aspect-ratio:1;border:2px solid var(--ink);background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(43,30,22,.35) 8px 10px),repeating-linear-gradient(-45deg,transparent 0 8px,rgba(43,30,22,.35) 8px 10px),var(--paper)}
.scene{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,250px) 108px;gap:14px;align-items:end;margin-top:12px}
.hello{align-self:center;padding-bottom:18px}
.hello .bubble{border-bottom-left-radius:var(--r-xl);border-bottom-right-radius:4px}
.sitcat{width:108px}
@media (max-width:640px){.scene{grid-template-columns:minmax(0,1fr) 88px}.hello{grid-column:1/-1;grid-row:1;padding:0}.street{grid-row:2;height:112px}.sitcat{grid-row:2;width:88px}}
.mark{width:44px;height:44px;flex:none}
.wrap.login-wrap{max-width:880px;min-height:100dvh;align-content:center;gap:20px;padding-block:16px}
.login-wrap .storefront{padding:18px 22px 0}
.login-wrap h1{font-size:38px;line-height:46px}
@media (max-width:600px){.login-wrap h1{font-size:30px;line-height:38px}}
.login-wrap .xk-panel{padding:18px 24px 22px}
.lform{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
@media (max-width:600px){.fields{grid-template-columns:1fr}}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:14px}
.field input,.search{font:inherit;min-height:44px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;background:var(--white);color:var(--ink);width:100%}
.en{margin:0;font-family:var(--display);font-size:15px;line-height:22px;letter-spacing:.08em;color:var(--terracotta)}
.err{color:var(--terracotta);font-weight:700;font-size:14px;min-height:22px;margin:-4px 0}

/* 頂欄 */
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .disp{font-size:24px}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 匯入、統整 */
.drop{border:2px dashed var(--ink-muted);border-radius:var(--r-lg);background:var(--paper);padding:22px;text-align:center}
.drop.over{background:var(--gold-tint)}
table.list{border-collapse:collapse;width:100%;font-size:14px;line-height:22px}
table.list th,table.list td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.list th{color:var(--ink-muted)}
.tablebox{overflow-x:auto}
.prog{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.prog li{display:flex;gap:10px;color:var(--ink-muted)}
.prog li .mk{width:22px;flex:none;font-weight:700}
.prog li.ok{color:var(--ink)}.prog li.ok .mk{color:var(--ok-ink)}.prog li.run .mk{color:var(--terracotta)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:38px;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;color:var(--ink-muted)}

/* AI 逐題引導 */
.items{display:grid;gap:8px;margin-top:8px}
.item{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;background:var(--white)}
.item label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.item input{flex:none;margin-top:6px;accent-color:var(--terracotta);width:18px;height:18px}
details{margin-top:4px;font-size:14px;line-height:22px;color:var(--ink-muted)}
summary{cursor:pointer;color:var(--terracotta);font-weight:700}
.ctx{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.ctx li{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:15px}
.quote{border-left:4px solid var(--gold);background:var(--gold-tint);padding:8px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:8px;font-size:15px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;cursor:pointer;background:var(--white);min-height:44px}
.opt:has(input:checked){border-color:var(--ink);background:var(--gold-tint)}
.opt input{margin-top:5px;accent-color:var(--terracotta);width:18px;height:18px}
textarea{font:inherit;width:100%;min-height:76px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:8px;color:var(--ink);background:var(--white)}
.history{display:grid;gap:6px}
.history div{display:flex;gap:10px;align-items:baseline;justify-content:space-between;background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:14px;line-height:22px}
.linkbtn{font:inherit;font-size:14px;background:none;border:0;color:var(--terracotta);font-weight:700;cursor:pointer;min-height:32px;white-space:nowrap}

/* 頁面：頂欄＋（進度路）＋一個內容區塊，整頁一起捲動（不凍結） */
.wrap.app{gap:0;padding-block:0 12px}
.wrap.app > .xk-panel{margin-top:2px}
.wrap.app > .note{margin-top:28px}
.pagetop{display:grid;gap:16px;padding:14px 0 16px}
/* 內容區塊：phead＝區塊上方的標題列（標題、搜尋、進度、分類標籤），pbody＝內容 */
.xk-panel.one{padding:0}
.phead{display:grid;gap:12px;padding:18px 24px 8px}
.pbody{padding:8px 24px 24px;min-width:0}
.pbody.stack{align-content:start}
.ttl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-width:0}
.ttl .xk-cap{margin:0}
.ttl h2{font-size:20px;line-height:28px}
.mtitle{font-size:24px;line-height:32px}
.xk-seg button:disabled{color:var(--ink-muted);cursor:not-allowed;display:inline-flex;align-items:center;gap:6px}
.lockic{width:14px;height:14px;flex:none}
/* 分類標籤（主管、新人） */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
@media (min-width:720px){.tabs{flex-wrap:wrap;overflow:visible}}
.tab{position:relative;flex:none;font-family:var(--display);font-size:15px;line-height:22px;min-height:44px;padding:8px 14px 10px;border:1.5px solid var(--line);background:var(--white);color:var(--ink);border-radius:var(--r-lg);cursor:pointer;overflow:hidden}
.tab[aria-selected="true"]{background:var(--gold);border:2px solid var(--ink)}
.tab .mini{position:absolute;left:0;bottom:0;height:4px;background:var(--terracotta-light)}
.tab .ok{color:var(--ok-ink);font-family:var(--body);font-weight:700;font-size:13px;margin-left:4px}
mark{background:var(--gold);color:var(--ink);border-radius:3px}
.empty{padding:20px;text-align:center;color:var(--ink-muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--white);border-radius:var(--r-lg);padding:8px 16px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>

<!-- Word 產生器（瀏覽器端產生 .docx，需要網路） -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<script>

const lockSVG = `<svg class="lockic" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2" fill="currentColor"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
const footer = (extra = "") => `<footer class="note"><span>示範資料：好物集為虛構公司，人名、訂單與數字皆為示範；示範登入不會檢查密碼，也不會送出任何資料。</span>${extra}</footer>`;
const fileKey = list => list.map(f => f.name).join("|");
function toTop(){ window.scrollTo({top: 0}); }  // 換分類、換題目時回到頁面頂端

// ---------- 登入（由上往下，一個畫面看完） ----------
let pickRole = "manager";
function renderLogin(){
  stopTimer(); S.user = null; S.view = "login"; S.shown = "login";
  $("#app").className = "wrap login-wrap";
  $("#app").innerHTML = `
  <section class="storefront flip">

    <div class="scene">
      <div class="street" aria-hidden="true"><div class="bld a"><div class="grille"></div></div><div class="bld b"><div class="awning"></div><div class="door"></div></div><div class="bld c"><div class="awning"></div></div></div>
      <div class="hello"><div class="bubble" aria-live="polite"><div class="who">小橘</div><div class="say-text" id="helloText">早安，選好身分再登入，我帶你進店裡。</div></div></div>
      <button class="catbtn sitcat" id="sitcat" type="button" aria-label="小橘：再說一次">${xiaoju({expr: "default"})}</button>
    </div>
  </section>
  <section class="xk-panel flip" style="animation-delay:.12s">
    <span class="xk-cap">登入</span>
    <form id="lf" class="lform" novalidate>
      <div class="xk-seg" role="group" aria-label="身分">
        <button type="button" data-r="manager" aria-pressed="${pickRole === "manager"}">主管</button>
        <button type="button" data-r="newbie" aria-pressed="${pickRole === "newbie"}">新人</button>
      </div>
      <div class="fields">
        <div class="field"><label for="acc">帳號</label><input id="acc" autocomplete="off" placeholder="${ACCOUNTS[pickRole].id}"></div>
        <div class="field"><label for="pw">密碼</label><input id="pw" type="password" autocomplete="off"></div>
      </div>
      <p class="err" id="err"></p>
      <div class="row"><button class="xk-btn" type="submit">登入</button><button class="xk-btn-ghost" type="button" id="fillDemo">帶入示範帳號</button></div>
    </form>
  </section>${footer('<button class="linkbtn" id="resetDemo" type="button">重設示範（回到第一次使用）</button>')}`;
  let armed = 0;
  $("#resetDemo").onclick = () => {
    if (Date.now() - armed > 4000) { armed = Date.now(); $("#resetDemo").textContent = "再按一次就重設"; return; }
    try { Object.keys(localStorage).filter(k => k.startsWith("knowhow-")).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    resetFlow(); S.step = 1; S.files = []; S.filesKey = ""; S.pub = null; S.mtab = "all"; S.find = ""; S.rtab = "";
    $("#resetDemo").textContent = "重設示範（回到第一次使用）"; armed = 0; toast("已重設：回到第一次使用，主管版 SOP 尚未統整");
  };
  const hello = ["早安，選好身分再登入，我帶你進店裡。", "主管負責整理 SOP，新人負責把它看熟。", "忘記帳號的話，按「帶入示範帳號」就好。"];
  let k = 0;
  $("#sitcat").onclick = () => { pop($("#sitcat svg")); $("#helloText").textContent = hello[++k % hello.length]; };
  document.querySelectorAll(".xk-seg button").forEach(b => b.onclick = () => {

  $("#fillDemo").onclick = () => { $("#acc").value = ACCOUNTS[pickRole].id; $("#pw").value = "demo"; $("#err").textContent = ""; };
  $("#lf").onsubmit = e => {
    e.preventDefault();
    const a = $("#acc").value.trim(), p = $("#pw").value;
    const other = Object.entries(ACCOUNTS).find(([k2, v]) => v.id === a && k2 !== pickRole);
    if (!a || !p) { $("#err").textContent = "請輸入帳號和密碼。"; return; }
    if (other) { $("#err").textContent = `這是${other[1].role}帳號，請先切換到「${other[1].role}」。`; return; }
    if (a !== ACCOUNTS[pickRole].id) { $("#err").textContent = "帳號或密碼不正確。"; return; }

// ---------- 版面：頂欄＋（進度路）＋一個內容區塊，整頁一起捲動 ----------
function shell(top, body, extraFoot = ""){
  const nav = navHTML();
  const u = S.user, changed = S.shown !== S.view; S.shown = S.view;
  $("#app").className = "wrap app";
  $("#app").innerHTML = `<div class="pagetop"><header class="top">
      <div class="brand">${markSVG}<span class="disp">經驗柑仔店</span><span class="chip role">${esc(u.role)}</span></div>
      ${nav}
      <div class="who"><span class="small">${esc(u.name)}｜${esc(u.title)}</span><button class="xk-btn-ghost" type="button" id="logout">登出</button></div>
    </header>${top}</div>${body}${footer(extraFoot)}`;
  if (!changed) document.querySelectorAll("#app .flip").forEach(el => el.classList.remove("flip"));
  $("#logout").onclick = () => { stopTimer(); renderLogin(); window.scrollTo({top: 0}); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
}
// ---------- 頁面與導覽列登記 ----------
// 組員新增頁面（問答、測驗、評分…）時：在 PAGES 加一筆、在 NAV 加一顆按鈕，再寫一個 render 函式。
// 詳細步驟見交接說明「新增頁面」。
const FLOW = ["import", "clean", "confirm"];       // 主管「SOP 統整」的第 1～3 格
const PAGES = {
  import:  {role: "manager", render: () => vImport()},
  clean:   {role: "manager", render: () => vClean()},
  confirm: {role: "manager", render: () => vConfirm()},
  msop:    {role: "manager", render: () => vMsop(), locked: () => !hasPub()},   // 第一次統整完成前鎖住
  read:    {role: "newbie",  render: () => vRead()},
};
const NAV = {   // 每個身分頂欄上的按鈕；只有一顆時不顯示導覽列（新人目前只有一頁）
  manager: [{to: "flow", label: "SOP 統整"}, {to: "msop", label: "主管版 SOP", lockedTip: "完成第一次統整、產生主管版 SOP 後開放"}],
  newbie:  [{to: "read", label: "新人版 SOP"}],
};
const HOME = {manager: () => FLOW[Math.min(S.step, S.maxStep) - 1], newbie: () => "read"};  // 登入後、或去不了的頁面改去這裡
function navHTML(){
  const items = NAV[S.user.key] || [];
  if (items.length < 2) return "";
  return `<nav class="xk-seg" aria-label="主要">${items.map(n => {
    const p = PAGES[n.to], locked = !!(p && p.locked && p.locked());
    const cur = n.to === "flow" ? FLOW.includes(S.view) : S.view === n.to;
    return locked ? `<button type="button" disabled title="${esc(n.lockedTip || "尚未開放")}">${lockSVG}${esc(n.label)}</button>`
      : `<button type="button" data-go="${n.to}" ${cur ? 'aria-current="page"' : ""}>${esc(n.label)}</button>`;
  }).join("")}</nav>`;
}
function go(v){
  if (!S.user) return renderLogin();
  const role = S.user.key;
  if (v === "flow") v = HOME.manager();
  const p = PAGES[v];
  if (!p || p.role !== role || (p.locked && p.locked())) v = HOME[role]();
  stopTimer(); S.view = v; window.scrollTo({top: 0});
  if (FLOW.includes(v)) S.step = FLOW.indexOf(v) + 1;
  PAGES[v].render();
}
function goStep(k){
  if (k < 1 || k > S.maxStep) return;
  if (k === 4) { go("msop"); return; }
  go(FLOW[k - 1]);
}

// ---------- 匯出（Word；檔名與內容不含時間） ----------
let dlP = null;
async function save(filename, blob){
  try { if (window.claude && claude.use) { dlP = dlP || claude.use("downloads"); const dl = await dlP;
      if (dl) { await dl.save({filename, data: blob}); toast("已送出下載：" + filename); return; } } }
  catch (e) { if (e && e.code === "declined") { toast("已取消下載"); return; } toast("這裡不能下載這個檔案"); return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast("已下載：" + filename); }
  catch (e) { toast("這個畫面不能下載檔案，請改用正式網頁版"); }
}
async function exportDocx(mode, doc){
  try { const blob = await sopDocxBlob(mode, doc); save(`好物集客服SOP_${mode === "senior" ? "主管版" : "新人版"}.docx`, blob); }
  catch (e) { toast("Word 產生器還沒載入，請確認網路連線後再試一次"); }
}
</script>
<script>
// manager.js｜主管：小橘帶路進度路、第 1 格匯入、第 2 格 AI 統整、第 3 格逐題確認、主管版 SOP
// 經驗柑仔店 Know-how Corner Store｜SOP 統整中心 — 範例公司「好物集」與所有資料皆為虛構。

// ---------- 小橘帶路：點格子或拖曳小橘，回到做過的步驟 ----------
const STEP_NAMES = ["匯入資料", "AI 統整", "資深確認", "主管版 SOP"];
const stepPos = k => (k - .5) / STEP_NAMES.length * 100;
const stepDone = k => k === 3 ? ITEMS.every(isDone) : k === 4 ? S.generated : S.maxStep > k;
function flowStepper(n){
  return `<div class="stepper flow" id="flow">
    <div class="rider" id="rider" style="left:${stepPos(n)}%" title="拖曳小橘，可以回到前面的格子">${xiaoju({gear: "senior", label: `小橘在第 ${n} 格，可拖曳`})}</div>
    <div class="road" id="road"><div class="fill" style="width:${stepPos(S.maxStep)}%"></div></div>
    <div class="stops">${STEP_NAMES.map((s, i) => { const k = i + 1;
      return `<button type="button" class="stop ${k === n ? "on" : ""}" data-step="${k}" ${k > S.maxStep ? "disabled" : ""} ${k === n ? 'aria-current="step"' : ""}><b>第 ${k} 格${stepDone(k) ? "　✓" : ""}</b>${s}</button>`; }).join("")}</div></div>`;
}
function wireFlow(n){
  document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => { if (+b.dataset.step !== n) goStep(+b.dataset.step); });
  const box = $("#flow"), road = $("#road"), rider = $("#rider");
  let drag = false;
  const at = e => { const r = road.getBoundingClientRect(); return Math.min(stepPos(S.maxStep), Math.max(stepPos(1), (e.clientX - r.left) / r.width * 100)); };
  const down = e => { drag = true; rider.classList.add("drag"); rider.style.left = at(e) + "%"; try { box.setPointerCapture(e.pointerId); } catch (x) {} e.preventDefault(); };
  rider.addEventListener("pointerdown", down); road.addEventListener("pointerdown", down);
  box.addEventListener("pointermove", e => { if (drag) rider.style.left = at(e) + "%"; });
  const up = e => { if (!drag) return; drag = false; rider.classList.remove("drag");
    const k = Math.min(S.maxStep, Math.max(1, Math.round(at(e) / (100 / STEP_NAMES.length) + .5)));
    if (k === n) rider.style.left = stepPos(n) + "%"; else goStep(k); };
  box.addEventListener("pointerup", up);
  box.addEventListener("pointercancel", () => { drag = false; rider.classList.remove("drag"); rider.style.left = stepPos(n) + "%"; });
}

// ---------- 主管：第 1 格 匯入 ----------
function resetFlow(){
  clearInterval(S.cleanTimer); S.cleanN = 0; S.batch = {}; S.ans = {}; S.idx = 0; S.editing = false;
  S.maxStep = 1; S.generated = false; S.dirty = false;
}
function vImport(){
  shell(flowStepper(1), `<section class="xk-panel one flip"><div class="phead"><div class="ttl"><span class="xk-cap">第 1 格</span><h2>匯入舊 SOP 和帶新人的紀錄</h2></div></div><div class="pbody stack">
      ${bubble(hasPub() ? "把新舊 SOP 和教學錄音、螢幕錄影、線上會議的逐字稿都放進來，我會幫你比對。" : "第一次使用：做完這 4 格、產生主管版 SOP 之後，上面的「主管版 SOP」才會打開。先把新舊 SOP 和教學紀錄放進來吧。")}
      <div class="drop" id="drop"><p style="margin:0 0 12px">把檔案拖到這裡，或</p>
        <div class="row" style="justify-content:center"><label class="xk-btn-ghost" for="file">選擇檔案</label><input id="file" type="file" multiple hidden>
        <button class="xk-btn-ghost" id="loadDemo" type="button">載入示範資料（9 個檔）</button></div></div>
      <div class="tablebox"><table class="list" id="ftable" hidden><thead><tr><th>檔名</th><th>類型</th><th>格式</th><th>日期</th></tr></thead><tbody></tbody></table></div>
      <p class="small muted" id="ownNote" style="margin:0" hidden>示範版會套用好物集的統整結果；正式版才會讀取你上傳的檔案內容。</p>
      <div class="row"><button class="xk-btn" id="start" type="button" disabled>開始統整 ›</button><span class="small muted" id="startNote"></span></div>
    </div></section>`);
  wireFlow(1);
  wireCats(["支援 Word、PDF、Excel、Markdown、LINE 匯出、CSV 和逐字稿（txt、srt、vtt）。", "把新舊 SOP 和教學錄音、螢幕錄影、線上會議的逐字稿都放進來，我會幫你比對。"]);
  const changed = () => S.maxStep > 1 && fileKey(S.files) !== S.filesKey;
  const sync = () => {
    $("#ftable tbody").innerHTML = S.files.map(f => `<tr><td>${esc(f.name)}</td><td><span class="chip ${f.kind === "教學逐字稿" ? "doing" : "todo"}">${esc(f.kind)}</span></td><td>${esc(f.format)}</td><td>${esc(f.date)}</td></tr>`).join("");
    $("#ftable").hidden = !S.files.length; $("#ownNote").hidden = !S.files.some(f => f.own);
    $("#start").disabled = !S.files.length;
    $("#start").textContent = S.maxStep === 1 ? "開始統整 ›" : changed() ? "重新開始統整 ›" : "下一格：AI 統整 ›";
    $("#startNote").textContent = changed() ? "檔案換過了：重新統整後，第 2、3 格要重做。" : S.maxStep > 1 ? "檔案沒變，第 2、3 格的進度都留著。" : "";
  };
  const addOwn = list => { const tr = /\.(srt|vtt)$|逐字稿|轉錄/i;
    S.files = [...list].map(f => ({name: f.name, own: true, kind: tr.test(f.name) ? "教學逐字稿" : "舊檔", format: (f.name.split(".").pop() || "").toUpperCase(), date: new Date(f.lastModified).toLocaleDateString("sv-SE")}));
    sync(); };
  $("#loadDemo").onclick = () => { S.files = DATA.files.slice(); sync(); };
  $("#file").onchange = e => addOwn(e.target.files);
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => e.dataTransfer.files.length && addOwn(e.dataTransfer.files));
  $("#start").onclick = () => {
    if (S.maxStep === 1 || changed()) { resetFlow(); S.filesKey = fileKey(S.files); S.maxStep = 2; startCleaning(); }
    goStep(2);
  };
  sync();
}

// ---------- 主管：第 2 格 AI 統整（離開頁面也會繼續跑，回來接著看） ----------
function cleanLines(){
  const c = DATA.cleaning, nFix = c.asr_fixes.reduce((a, b) => a + b.count, 0);
  return [`讀取 ${S.files.length} 個檔案（舊檔 ${S.files.filter(f => f.kind === "舊檔").length}、教學逐字稿 ${S.files.filter(f => f.kind !== "舊檔").length}）`,
    `整理逐字稿 ${c.transcript_lines} 句，「說話者 1／2」對應為林佩珊／陳宥廷`,
    `修正語音錯字 ${nFix} 處（例：好物公單→好物工單）`,
    `拆出 ${c.rules_found} 條規則，排進 9 個工作步驟`,
    `比對新舊版本，排除傳言 ${c.rumors_excluded} 則`];
}
function startCleaning(){
  clearInterval(S.cleanTimer); S.cleanN = 0;
  const fast = matchMedia("(prefers-reduced-motion: reduce)").matches;
  S.cleanTimer = setInterval(() => {
    S.cleanN++;
    const done = S.cleanN >= cleanLines().length;
    if (done) { clearInterval(S.cleanTimer); S.maxStep = Math.max(S.maxStep, 3); }
    if (S.view === "clean") paintClean(done);
  }, fast ? 60 : 650);
}
function vClean(){
  shell(flowStepper(2), `<section class="xk-panel one flip"><div class="phead"><div class="ttl"><span class="xk-cap">第 2 格</span><h2 id="ch">AI 統整中</h2></div></div>
    <div class="pbody stack"><ul class="prog" id="prog"></ul><div id="sumBox" class="stack" hidden></div>
      <div class="row" id="cfoot" hidden><button class="xk-btn" id="goConfirm" type="button">開始確認 ›</button></div></div></section>`);
  wireFlow(2); paintClean(false);
}
function paintClean(justDone){
  const lines = cleanLines(), n = Math.min(S.cleanN, lines.length);
  $("#prog").innerHTML = lines.map((l, i) => `<li class="${i < n ? "ok" : i === n ? "run" : ""}"><span class="mk">${i < n ? "✓" : i === n ? "…" : "・"}</span><span>${esc(l)}</span></li>`).join("");
  if (n < lines.length) return;
  const sm = DATA.summary, started = Object.keys(S.batch).length + Object.keys(S.ans).length;
  $("#ch").textContent = "AI 統整完成";
  $("#sumBox").innerHTML = `${bubble(`整理好了。${sm.total_rules} 條裡有 ${sm.auto_confirmed} 條你教的和舊檔一樣，我已經確認。剩下 ${sm.batch_cards + sm.questions} 項要請你判斷，我一題一題問你。`, {expr: "happy"})}
    <div class="kpis">${[[sm.total_rules, "條規則"], [sm.auto_confirmed, "條自動確認"], [sm.batch_cards, "張批次卡"], [sm.questions, "題要你判斷"]].map(([x, t]) => `<div class="xk-sheet kpi"><b>${x}</b><span>${t}</span></div>`).join("")}</div>`;
  $("#sumBox").hidden = false; $("#cfoot").hidden = false;
  $("#goConfirm").textContent = started ? `繼續確認（已確認 ${ITEMS.filter(isDone).length}／${ITEMS.length}）›` : "開始確認 ›";
  $("#goConfirm").onclick = () => goStep(3);
  wireCats();
  if (justDone) { pop($("#sumBox .xiaoju")); $("#flow").outerHTML = flowStepper(2); wireFlow(2); }
}

// ---------- 主管：第 3 格 AI 逐題引導確認 ----------
const ITEMS = [...DATA.batches.map((b, i) => ({kind: "batch", i, title: b.title})), ...DATA.questions.map((q, i) => ({kind: "q", i, title: `${q.no} ${q.topic}`}))];
const isDone = it => it.kind === "batch" ? S.batch[it.i] !== undefined : S.ans[it.i] !== undefined;
const answerText = it => {
  if (it.kind === "batch") { const a = S.batch[it.i], n = a.filter(Boolean).length; return n === a.length ? `${DATA.batches[it.i].buttons[0]}（${n} 條）` : `確認 ${n} 條，${a.length - n} 條列入待補`; }
  const q = DATA.questions[it.i], a = S.ans[it.i]; return a.text || q.options[a.j];
};
function vConfirm(){
  const done = ITEMS.filter(isDone).length, all = done === ITEMS.length;
  if (!S.editing && !all && isDone(ITEMS[S.idx])) S.idx = ITEMS.findIndex(it => !isDone(it));
  const showAll = all && !S.editing;
  shell(flowStepper(3), `<section class="xk-panel one flip"><div class="phead"><div class="row between">
      <div class="ttl"><span class="xk-cap">第 3 格</span><h2>${showAll ? "全部確認完了" : S.editing ? `修改第 ${S.idx + 1} 項` : `第 ${S.idx + 1} 項，共 ${ITEMS.length} 項`}</h2></div>
      <div class="row"><span class="chip ${all ? "done" : "warn"}">${all ? `✓ ${ITEMS.length} 項都確認了` : `! 已確認 ${done}／${ITEMS.length}`}</span><div class="row" id="glock"></div></div></div></div>
    <div class="pbody stack"><div id="qbox" class="stack"></div><div class="row" id="qact"></div>
      ${done ? `<details ${showAll ? "open" : ""}><summary>你已經回答的 ${done} 項</summary><div class="history" style="margin-top:8px">${ITEMS.map((it, k) => isDone(it) ? `<div><span><b>${esc(it.title)}</b>：${esc(answerText(it))}</span><button class="linkbtn" type="button" data-edit="${k}">修改</button></div>` : "").join("")}</div></details>` : ""}
    </div></section>`);
  wireFlow(3);
  document.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => { S.idx = +b.dataset.edit; S.editing = true; vConfirm(); toTop(); });
  $("#glock").innerHTML = all
    ? `${S.generated && S.dirty ? '<span class="chip warn">! 有修改還沒套用</span>' : ""}<button class="xk-btn" type="button" id="gen">${!S.generated ? "產生主管版 SOP ›" : S.dirty ? "更新主管版 SOP ›" : "查看主管版 SOP ›"}</button>`
    : `<button class="xk-btn" type="button" disabled title="還有 ${ITEMS.length - done} 項沒確認">產生主管版 SOP ›</button>`;
  if ($("#gen")) $("#gen").onclick = () => {
    if (!S.generated || S.dirty) { S.pub = buildRun(); store.set(PUB_KEY, S.pub); S.generated = true; S.dirty = false; S.maxStep = 4; S.mtab = "all"; S.find = "";
      toast("主管版 SOP 已更新為目前版本，新人登入就會看到"); }
    go("msop");
  };
  if (showAll) {
    $("#qbox").innerHTML = bubble(S.generated && !S.dirty ? "主管版 SOP 已經是最新的。要改答案的話，在下面的清單按「修改」。" : `${ITEMS.length} 項都確認好了。按上面的「${S.generated ? "更新" : "產生"}主管版 SOP」，我把你的回答寫進去。`, {expr: "happy"});
    wireCats(); pop($("#qbox .xiaoju"));
  } else {
    renderQ();
    $("#qact").insertAdjacentHTML("beforeend", `<span class="small muted">還有 ${ITEMS.length - done} 項沒確認；12 項都確認完，上方的「產生主管版 SOP」才會打開。</span>`);
  }
}
function renderQ(){
  const it = ITEMS[S.idx], box = $("#qbox"), act = $("#qact");
  const prev = S.idx > 0 ? '<button class="xk-btn-ghost" id="prev" type="button">上一項</button>' : "";
  const commit = (store_, key, val) => { const before = JSON.stringify(store_[key]); store_[key] = val; if (S.generated && before !== JSON.stringify(val)) S.dirty = true; answered(); };
  if (it.kind === "batch") {
    const b = DATA.batches[it.i], kept = S.batch[it.i] || b.items.map(() => true), open = !!S.batch[it.i] && S.batch[it.i].includes(false);
    const intro = {NEWER: `這 ${b.items.length} 條你教的和最新的舊檔一樣，只是更舊的檔案寫法不同。我建議全部照你教的，要一起確認嗎？`,
      ADD: `這 ${b.items.length} 條是你教學時新補充的細節，舊檔沒有寫。要收進 SOP 嗎？`,
      KEEP: `這 ${b.items.length} 條你沒有教到，但舊檔寫法一致。要照舊檔沿用嗎？`,
      EXPIRED: `這 ${b.items.length} 條是已經過期的暫時規則。我會把它移到版本歷史，不放進新版。`}[b.bucket];
    box.innerHTML = `${bubble(intro, {expr: "hint"})}
      <div class="xk-sheet"><div class="row between"><b>${esc(b.title)}（${b.items.length} 條）</b><button class="linkbtn" type="button" id="each">${open ? "收起清單" : "逐條檢視"}</button></div>
      <p class="small muted" style="margin:2px 0 0">${b.items.slice(0, 4).map(x => x.no + " " + x.topic).join("、")}${b.items.length > 4 ? `……等 ${b.items.length} 條` : ""}</p>
      <div class="items" id="eachBox" ${open ? "" : "hidden"}><p class="small muted" style="margin:0">不同意的取消勾選，該條會列入「待補」，不會出現在新人版。</p>${b.items.map((x, j) => `<div class="item"><label><input type="checkbox" data-j="${j}" ${kept[j] ? "checked" : ""}><span><b>${esc(x.no)}　${esc(x.topic)}</b><br>${esc(x.proposed)}</span></label>
        ${(x.older.length || x.ev) ? `<details><summary>看依據</summary>${x.older.map(o => `<div>舊檔：${esc(o)}</div>`).join("")}${x.ev ? `<div>你在${esc(x.ev)}</div>` : ""}</details>` : ""}</div>`).join("")}</div></div>`;
    act.innerHTML = `<button class="xk-btn" id="ok" type="button"></button>${prev}`;
    const sync = () => { const n = box.querySelectorAll("input:checked").length; $("#ok").textContent = n === b.items.length ? `${b.buttons[0]} ›` : `確認勾選的 ${n} 條 ›`; };
    box.querySelectorAll("input").forEach(i => i.onchange = sync); sync();
    $("#each").onclick = () => { const h = $("#eachBox").hidden = !$("#eachBox").hidden; $("#each").textContent = h ? "逐條檢視" : "收起清單"; };
    $("#ok").onclick = () => commit(S.batch, it.i, [...box.querySelectorAll("input")].map(i => i.checked));
  } else {
    const q = DATA.questions[it.i], cur = S.ans[it.i];
    box.innerHTML = `${bubble(q.ask, {expr: "confused", who: `小橘問你｜SOP ${q.no} ${q.topic}`})}
      <div class="xk-sheet"><b>各版本怎麼寫</b><ul class="ctx">${q.context.map(c => `<li><span class="chip todo">${esc(c.label)}</span> ${esc(c.text)}</li>`).join("")}</ul>
        ${q.ev ? `<div class="quote">你在${esc(q.ev)}</div>` : ""}</div>
      <div class="opts" role="radiogroup" aria-label="選一個答案">${q.options.map((o, j) => `<label class="opt"><input type="radio" name="o" value="${j}" ${cur && cur.j === j ? "checked" : ""}><span>${esc(o)}${q.ai_pick === o ? ' <span class="chip done">✓ AI 建議</span>' : ""}</span></label>`).join("")}</div>
      <div id="otherBox" class="field" hidden><label for="other">請寫下現在的做法</label><textarea id="other">${esc(cur && cur.text || "")}</textarea></div>
      ${q.why ? `<p class="small muted" style="margin:0">${esc(q.why)}</p>` : ""}`;
    act.innerHTML = `<button class="xk-btn" id="ok" type="button" disabled>確認 ›</button><button class="xk-btn-ghost" id="fill" type="button">帶入示範答案</button>${prev}`;
    const isOther = j => /其他/.test(q.options[j]);
    const upd = () => { const r = box.querySelector("input:checked"); $("#otherBox").hidden = !(r && isOther(+r.value)); $("#ok").disabled = !r || (isOther(+r.value) && !$("#other").value.trim()); };
    box.querySelectorAll("input[type=radio]").forEach(i => i.onchange = upd); $("#other").oninput = upd; upd();
    $("#fill").onclick = () => { box.querySelector(`input[value="${q.options.indexOf(q.simulated)}"]`).checked = true; upd(); };
    $("#ok").onclick = () => { const j = +box.querySelector("input:checked").value; commit(S.ans, it.i, {j, text: isOther(j) ? $("#other").value.trim() : ""}); };
  }
  wireCats();
  if ($("#prev")) $("#prev").onclick = () => { S.idx--; S.editing = true; vConfirm(); toTop(); };
}
function answered(){
  S.editing = false;
  const k = ITEMS.findIndex((it, n) => n > S.idx && !isDone(it)), k2 = k >= 0 ? k : ITEMS.findIndex(it => !isDone(it));
  S.idx = k2 < 0 ? 0 : k2; vConfirm(); toTop();
}
function buildRun(){ // 只依主管的回答套用 review.json 的 result_rule；其餘欄位沿用模擬資料，不改內容
  const rules = DATA.rules.map(r => ({...r, pending: false, byYou: ""})), byId = Object.fromEntries(rules.map(r => [r.id, r])), pending = [];
  DATA.batches.forEach((b, i) => b.items.forEach((x, j) => { if ((S.batch[i] || [])[j] === false && b.bucket !== "EXPIRED" && byId[x.id]) { byId[x.id].pending = true; pending.push(byId[x.id]); } }));
  const decisions = DATA.questions.map((q, i) => {
    const a = S.ans[i], opt = q.options[a.j], r = byId[q.id];
    if (opt === q.simulated) r.rule = q.result_rule; else { r.rule = a.text || opt.replace(/（[^）]*）$/, ""); r.byYou = "依資深選擇修改"; }
    return {no: q.no, topic: q.topic, ask: q.ask, answer: a.text || opt};
  });
  const now = new Date();
  return {version: now.toLocaleDateString("sv-SE"), at: now.toLocaleString("zh-TW", {hour12: false}).replace(/:\d\d$/, ""), by: S.user.name, rules, pending, decisions};
}

// ---------- 主管：主管版 SOP（搜尋＋分類標籤；畫面內容＝匯出的 Word） ----------
function vMsop(){
  const doc = S.pub, m = sopModel("senior", doc);
  if (S.mtab !== "all" && !m.secs.some(s => s.id === S.mtab)) S.mtab = "all";
  shell("", `<section class="xk-panel one flip"><div class="phead">
      <div class="row between">
        <div><h2 class="mtitle">主管版 SOP</h2><p class="small muted" style="margin:2px 0 0">最後更新 ${esc(doc.at)}｜${esc(doc.by)} 確認</p></div>
        <div class="row">${S.dirty ? '<span class="chip warn">! 第 3 格有修改還沒套用</span>' : '<span class="chip done">✓ 新人看到的就是這一版</span>'}<button class="xk-btn" type="button" id="exDocx">匯出 Word ›</button></div></div>
      <input class="search" id="find" type="search" placeholder="搜尋規則：例如 退款、鑑賞期、7-9" aria-label="搜尋主管版 SOP" value="${esc(S.find)}">
      <div class="tabs" role="tablist" aria-label="分類">${[{id: "all", tab: "全部"}, ...m.secs].map(s => `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${S.mtab === s.id}">${esc(s.tab)}</button>`).join("")}</div>
    </div><div class="pbody"><div id="docbox"></div></div></section>`);
  const render = () => {
    const q = S.find.trim();
    $("#docbox").innerHTML = sopDocHTML("senior", doc, S.mtab === "all" && !q ? null : S.mtab === "all" ? m.secs.map(s => s.id) : [S.mtab]);
    if (q) highlight($("#docbox"), q);
  };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.mtab = b.dataset.tab; document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", String(x === b))); render(); toTop(); });
  $("#find").oninput = e => { S.find = e.target.value; render(); toTop(); };
  render();
  $("#exDocx").onclick = () => exportDocx("senior", doc);
}
function highlight(root, q){
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
  let hits = 0;
  root.querySelectorAll(".sd-sec").forEach(sec => {
    let secHits = 0;
    sec.querySelectorAll("tbody tr").forEach(tr => {
      const ok = tr.textContent.includes(q); tr.hidden = !ok;
      if (ok) { secHits++; tr.querySelectorAll("td").forEach(td => { td.innerHTML = td.innerHTML.replace(/>([^<]+)</g, (mm, t) => ">" + t.replace(re, x => `<mark>${x}</mark>`) + "<").replace(/^([^<]+)/, t => t.replace(re, x => `<mark>${x}</mark>`)); }); }
    });
    sec.hidden = !secHits; hits += secHits;
  });
  if (!hits) root.insertAdjacentHTML("beforeend", `<p class="empty">找不到「${esc(q)}」。換個關鍵字試試，例如「退款」或「7-9」。</p>`);
}

<script>
// newbie.js｜新人：新人版 SOP 閱讀、閱讀進度（依字數估時間）
// 經驗柑仔店 Know-how Corner Store｜SOP 統整中心 — 範例公司「好物集」與所有資料皆為虛構。

// ---------- 新人：新人版 SOP（分類標籤＋閱讀進度；畫面內容＝匯出的 Word） ----------
const READ_SECS = () => sopModel("newbie", S.pub).secs;
function needSec(s){ // 依內容字數估算閱讀時間（每分鐘約 250 字），最少 20 秒
  const chars = (s.title + s.desc + s.rows.map(r => r.cells.map(c => typeof c === "string" ? c : c.lines ? c.lines.join("") : (c.topic + c.text)).join("")).join("") + (s.tips || []).map(t => t.type + t.tip).join("")).length;
  return Math.max(20, Math.round(chars / 250 * 60));
}
let timer = null;
function stopTimer(){ clearInterval(timer); timer = null; }
function progKey(){ return `knowhow-read-${S.user.id}-${S.pub.version}-${S.pub.at}`; }
function vRead(){
  if (!hasPub()) {
    shell("", `<section class="xk-panel one flip"><div class="phead"><div class="ttl"><span class="xk-cap">新人版 SOP</span><h2>你好，${esc(S.user.name.slice(1))}</h2></div></div>
      <div class="pbody">${bubble("新人版 SOP 還在準備中。主管完成第一次統整後，這裡就會出現，到時候再登入看看。", {expr: "hint"})}</div></section>`);
    wireCats(); return;
  }
  const doc = S.pub, secs = READ_SECS();
  const P = store.get(progKey()) || {};
  secs.forEach(s => { s.need = needSec(s); P[s.id] = Math.min(P[s.id] || 0, s.need); });
  if (!S.rtab || (S.rtab !== "all" && !secs.some(s => s.id === S.rtab))) S.rtab = (secs.find(s => P[s.id] < s.need) || secs[0]).id;
  const totalNeed = secs.reduce((a, s) => a + s.need, 0);
  const fmt = n => n < 60 ? `${n} 秒` : `${Math.ceil(n / 60 * 2) / 2} 分鐘`;
  shell("", `<section class="xk-panel one flip"><div class="phead">
    <div class="row between">
      <div class="ttl"><span class="xk-cap">新人版 SOP</span><h2>你好，${esc(S.user.name.slice(1))}</h2><span class="small muted">整份約 ${Math.ceil(totalNeed / 60)} 分鐘</span></div>
      <button class="xk-btn" type="button" id="exDocx">匯出 Word ›</button>
    </div>
    <div class="stepper read" aria-label="閱讀進度">
      <div class="rider" id="rider">${xiaoju({gear: "rookie", label: "小橘陪你讀到這裡"})}</div>
      <div class="road"><div class="fill" id="rfill"></div></div>
      <div class="row between small" style="margin-top:6px"><span class="muted"><span id="rtext"></span>｜<span id="rdone"></span></span></div>
    </div>
    <div class="tabs" role="tablist" aria-label="分類">${secs.map(s => `<button class="tab" role="tab" type="button" data-tab="${s.id}" aria-selected="${S.rtab === s.id}">${esc(s.tab)}<span class="ok" data-ok="${s.id}"></span><span class="mini" data-mini="${s.id}"></span></button>`).join("")}<button class="tab" role="tab" type="button" data-tab="all" aria-selected="${S.rtab === "all"}">整份 SOP</button></div>
  </div><div class="pbody"><div id="docbox"></div><div id="readSay" style="margin-top:16px"></div><div class="row" id="nextRow" style="margin-top:12px"></div></div></section>`, `<label class="speed"><input type="checkbox" id="speed" ${S.speed > 1 ? "checked" : ""}> 簡報示範用：閱讀時間加速 10 倍</label>`);
  const say = (t, expr = "default") => { $("#readSay").innerHTML = bubble(t, {expr}); wireCats(["慢慢看沒關係，切換分類時進度會留著。", "看到舊檔寫的不一樣，以這份為準。", "不確定的規則，先回客人「確認後幾點前回覆您」，再去問帶你的學長姐。"]); };
  const paint = () => {
    const got = secs.reduce((a, s) => a + Math.min(P[s.id], s.need), 0), pct = Math.round(got / totalNeed * 100), doneN = secs.filter(s => P[s.id] >= s.need).length;
    $("#rfill").style.width = pct + "%"; $("#rider").style.left = `calc(${pct}% * .92 + 4%)`;
    $("#rtext").textContent = `閱讀進度 ${pct}%`; $("#rdone").textContent = `已讀完 ${doneN}／${secs.length} 格`;
    secs.forEach(s => { const r = Math.min(1, P[s.id] / s.need);
      document.querySelector(`[data-mini="${s.id}"]`).style.width = (r * 100) + "%";
      document.querySelector(`[data-ok="${s.id}"]`).textContent = r >= 1 ? "✓" : ""; });
  };
  const showStatus = fresh => {
    const i = secs.findIndex(s => s.id === S.rtab), s = secs[i];
    if (!s) { say("這是整份新人版，和匯出的 Word 一樣。"); $("#nextRow").innerHTML = ""; return; }
    const done = P[s.id] >= s.need, allDone = secs.every(x => P[x.id] >= x.need);
    say(allDone ? "整份新人版都讀完了。之後有更新，我會在這裡提醒你。" : done ? `「${s.tab}」這一格讀完了。` : `「${s.tab}」慢慢看，切換分類時進度會留著。`, done ? "happy" : "default");
    $("#nextRow").innerHTML = `${done ? `<span class="stamp ${fresh ? "go" : ""}">已讀</span>` : ""}
      ${secs[i + 1] ? `<button class="xk-btn-ghost" type="button" id="nextSec">下一格：${esc(secs[i + 1].tab)} ›</button>` : ""}`;
    if ($("#nextSec")) $("#nextSec").onclick = () => select(secs[i + 1].id);
    if (fresh) pop($("#readSay .xiaoju"));
  };
  const select = id => {
    S.rtab = id; document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", String(x.dataset.tab === id)));
    $("#docbox").innerHTML = sopDocHTML("newbie", doc, id === "all" ? null : [id]);
    paint(); showStatus(false); toTop();
    const t = document.querySelector(`[data-tab="${id}"]`); if (t) t.scrollIntoView({inline: "nearest", block: "nearest"});
  };
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => select(b.dataset.tab));
  $("#exDocx").onclick = () => exportDocx("newbie", doc);
  $("#speed").onchange = e => { S.speed = e.target.checked ? 10 : 1; };
  select(S.rtab);
  timer = setInterval(() => {
    if (document.visibilityState !== "visible" || S.rtab === "all") return;
    const s = secs.find(x => x.id === S.rtab); if (!s || P[s.id] >= s.need) return;
    P[s.id] = Math.min(s.need, P[s.id] + S.speed); store.set(progKey(), P); paint();
    if (P[s.id] >= s.need) showStatus(true);
  }, 1000);
}
</script>
