<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考核系統｜員工總覽｜巷口服務所</title>
<link rel="stylesheet" href="css/app.css">
<style>.matrix-wrap { overflow-x: auto; } .tabs { display: flex; gap: 8px; margin: 12px 0; }</style>
</head>
<body>
<main>
  <p class="cap">第 1 格・主管後台</p>
  <h1>主管後台</h1>
  <div class="tabs" role="tablist">
    <button class="btn" id="tab-overview" role="tab">員工總覽</button>
    <button class="btn ghost" id="tab-papers" role="tab">出題</button>
    <button class="btn ghost" id="tab-review" role="tab">題庫審核</button>
    <button class="btn ghost" id="tab-add" role="tab">新增員工</button>
  </div>
  <div id="panel"></div>
</main>
<script type="module">
import { requireRole } from './js/guard.js';
import { renderNav, h, showError, setBusy } from './js/ui.js';
import { select, rpc, callFn } from './js/api.js';
import { stageShort, stageLabel, errorTypeCounts, dueStatus, createErrorLabel, levelLabel, DIFFICULTY_NAMES, fmtDate } from './js/format.js';
import { parseRoster } from './js/roster.js';
import { renderErrorBars } from './js/report.js';

const me = await requireRole('supervisor');
renderNav(me, 'supervisor.html');
const panel = document.getElementById('panel');
const tabOverview = document.getElementById('tab-overview');
const tabReview = document.getElementById('tab-review');
const tabPapers = document.getElementById('tab-papers');
const tabAdd = document.getElementById('tab-add');
const STAGES = [12, 13, 14];

function activate(which) {
  tabOverview.className = `btn ${which === 'overview' ? '' : 'ghost'}`;
  tabReview.className = `btn ${which === 'review' ? '' : 'ghost'}`;
  tabPapers.className = `btn ${which === 'papers' ? '' : 'ghost'}`;
  tabPapers.setAttribute('aria-selected', which === 'papers');
  tabAdd.className = `btn ${which === 'add' ? '' : 'ghost'}`;
  tabOverview.setAttribute('aria-selected', which === 'overview');
  tabReview.setAttribute('aria-selected', which === 'review');
  tabAdd.setAttribute('aria-selected', which === 'add');
}

async function showOverview() {
  activate('overview');
  setBusy(panel);
  try {
    const [profiles, sums, errs, statuses] = await Promise.all([
      select('profiles', { columns: 'id, name, role', order: ['name', 'asc'] }),
      select('v_stage_summary', { columns: 'user_id, stage, best_score, attempts, passed' }),
      select('v_error_counts', { columns: 'error_type, cnt' }),
      select('v_exam_schedule', { columns: 'user_id, hire_date, due_1, due_3, due_6, level, passed_1, passed_2, passed_3' }),
    ]);
    const stat = new Map(statuses.map((s) => [s.user_id, s]));
    const dueCell = (uid) => {
      const s = stat.get(uid) || {};
      const lines = [['基礎', s.due_1, s.passed_1], ['情境', s.due_3, s.passed_2], ['綜合', s.due_6, s.passed_3]]
        .map(([n, d, ok]) => { const x = dueStatus(d, !!ok); return h('div', { class: `due ${x.level}` }, `${n}：${x.label}`); });
      return h('td', { class: 'due-col' }, h('div', { class: 'muted' }, levelLabel(s.level)), ...lines);
    };
    const employees = profiles.filter((p) => p.role === 'employee');
    const by = new Map(sums.map((s) => [`${s.user_id}:${s.stage}`, s]));
    const cell = (uid, stage) => {
      const s = by.get(`${uid}:${stage}`);
      if (!s) return h('td', { 'data-stage': stage, class: 'muted' }, '—');
      return h('td', { 'data-stage': stage, class: s.passed ? 'cell-ok' : 'cell-bad', title: `已考 ${s.attempts} 次` },
        `${s.best_score} ${s.passed ? '✔' : '✘'}`);
    };
    panel.replaceChildren(
      h('p', { class: 'muted' }, '格內為各階段最高分：✔ 已通過（基礎 80／情境 85／綜合 90）、✘ 未通過、— 未考。點員工姓名看詳情。'),
      employees.length
        ? h('div', { class: 'matrix-wrap' }, h('table', { class: 'matrix' },
            h('thead', {}, h('tr', {}, h('th', {}, '員工'), ...STAGES.map((s) => h('th', { title: stageLabel(s) }, stageShort(s))), h('th', {}, '考核期限'))),
            h('tbody', {}, employees.map((e) => h('tr', { 'data-uid': e.id },
              h('td', {}, h('a', { class: 'emp-link', href: `employee.html?id=${e.id}` }, e.name)),
              ...STAGES.map((s) => cell(e.id, s)), dueCell(e.id))))))
        : h('p', { class: 'muted' }, '還沒有員工帳號。'),
      h('h2', {}, '全體錯誤類型'),
      renderErrorBars(errorTypeCounts(errs)));
  } catch (e) { showError(panel, e); }
}


const PAPER_STATUS = { draft: '草稿（審核中）', locked: '已出題（新人可作答）', used: '已使用' };

/** 出題：產生草稿 → 刪除不合適的題 → 隨機補到題數 → 鎖定並出題。 */
async function showPapers(openId = null) {
  activate('papers');
  if (openId) return showPaperEditor(openId);
  setBusy(panel);
  try {
    const [profiles, papers] = await Promise.all([
      select('profiles', { columns: 'id, name, role', order: ['name', 'asc'] }),
      rpc('list_papers', {}),
    ]);
    const employees = profiles.filter((p) => p.role === 'employee');
    const selUser = h('select', { id: 'p-user', 'aria-label': '員工' }, employees.map((e) => h('option', { value: e.id }, e.name)));
    const selStage = h('select', { id: 'p-stage', 'aria-label': '考核階段' }, STAGES.map((s) => h('option', { value: s }, stageLabel(s))));
    const msg = h('div', { 'aria-live': 'polite' });
    const create = h('button', { class: 'btn', id: 'create-paper', onclick: async () => {
      try { const id = await rpc('create_paper', { p_user: selUser.value, p_stage: Number(selStage.value) }); await showPapers(id); }
      catch (e) { showError(msg, e); }
    } }, '隨機抽題，產生草稿考卷');
    panel.replaceChildren(
      h('p', { class: 'muted' }, '出題流程：先隨機抽題成草稿 → 檢查每題難易度是否合適，不合適的刪除（暫時移出這一輪的牌堆）→ 按「隨機補到題數」補滿 → 確定後「鎖定並出題」，新人才看得到並能開始考。'),
      employees.length ? h('div', { class: 'row' }, selUser, selStage, create) : h('p', { class: 'muted' }, '還沒有員工帳號。'),
      msg,
      h('h2', {}, '考卷'),
      papers.length
        ? h('table', { class: 'papers' },
            h('thead', {}, h('tr', {}, ['員工', '階段', '狀態', '題數', '建立時間', ''].map((t) => h('th', {}, t)))),
            h('tbody', {}, papers.map((p) => h('tr', { 'data-paper': p.id },
              h('td', {}, p.user_name), h('td', {}, stageShort(p.stage)), h('td', {}, PAPER_STATUS[p.status]), h('td', {}, String(p.count)),
              h('td', {}, fmtDate(p.created_at)),
              h('td', {}, h('button', { class: 'btn ghost open-paper', onclick: () => showPapers(p.id) }, p.status === 'draft' ? '審核' : '查看'))))))
        : h('p', { class: 'muted' }, '還沒有考卷。'));
  } catch (e) { showError(panel, e); }
}

async function showPaperEditor(id) {
  setBusy(panel);
  const msg = h('div', { 'aria-live': 'polite' });
  try {
    const g = await rpc('get_paper', { p_paper: id });
    const draft = g.status === 'draft';
    const all = h('input', { type: 'checkbox', 'aria-label': '全選', onchange: (ev) => panel.querySelectorAll('input.pick').forEach((c) => (c.checked = ev.target.checked)) });
    const detail = (q) => h('details', {},
      h('summary', {}, q.stem.replace(/\s+/g, ' ').slice(0, 60)),
      h('p', { class: 'stem' }, q.stem),
      q.options ? h('ol', { type: 'A' }, q.options.map((o, i) => h('li', { class: i === q.correct_index ? 'cell-ok' : '' }, o + (i === q.correct_index ? '　✔ 正確答案' : '')))) : null,
      q.reference_answer ? h('p', {}, `參考答案：${q.reference_answer}`) : null,
      q.rubric ? h('p', {}, `得分點：${q.rubric.join('；')}`) : null,
      q.explanation ? h('p', { class: 'muted' }, `解析：${q.explanation}`) : null);
    const picked = () => [...panel.querySelectorAll('input.pick:checked')].map((c) => c.dataset.qid);
    const run = (fn) => async () => { try { await fn(); await showPaperEditor(id); } catch (e) { showError(msg, e); } };
    const full = g.count >= g.total;
    const buttons = draft ? h('div', { class: 'row' },
      h('button', { class: 'btn ghost', id: 'remove-from-paper', onclick: async () => {
        const ids = picked();
        if (!ids.length) { msg.replaceChildren(h('p', { class: 'notice warn' }, '請先勾選要刪除的題目。')); return; }
        try { await rpc('remove_from_paper', { p_paper: id, p_ids: ids }); await showPaperEditor(id); } catch (e) { showError(msg, e); }
      } }, '刪除勾選的題目'),
      h('button', { class: 'btn', id: 'refill', disabled: full, onclick: run(() => rpc('refill_paper', { p_paper: id })) }, `隨機補到 ${g.total} 題`),
      h('button', { class: 'btn', id: 'lock-paper', disabled: !full, onclick: async () => {
        if (!confirm('鎖定後題目就不能再改，新人隨即可以開始考試。確定出題嗎？')) return;
        try { await rpc('lock_paper', { p_paper: id, p_allow_short: false }); await showPaperEditor(id); } catch (e) { showError(msg, e); }
      } }, '鎖定並出題'),
      h('button', { class: 'btn ghost', id: 'discard-paper', onclick: async () => {
        if (!confirm('確定捨棄這份草稿？')) return;
        try { await rpc('discard_paper', { p_paper: id }); await showPapers(); } catch (e) { showError(msg, e); }
      } }, '捨棄草稿'))
      : (g.status === 'locked' ? h('div', { class: 'row' }, h('button', { class: 'btn ghost', id: 'discard-paper', onclick: async () => {
          if (!confirm('新人還沒開始考，確定收回這份已出題的考卷嗎？')) return;
          try { await rpc('discard_paper', { p_paper: id }); await showPapers(); } catch (e) { showError(msg, e); }
        } }, '收回考卷')) : null);
    panel.replaceChildren(
      h('p', {}, h('a', { href: '#', id: 'back-papers', onclick: (ev) => { ev.preventDefault(); showPapers(); } }, '← 回到考卷列表')),
      h('h2', {}, `${g.user_name}・${stageLabel(g.stage)}`),
      h('p', { class: 'muted', id: 'paper-meta' }, `${PAPER_STATUS[g.status]}・目前 ${g.count}／${g.total} 題・抽題難度 ${DIFFICULTY_NAMES[g.difficulty]}`
        + (draft ? '。請檢查每題難易度是否合適，不合適的刪除後再補題；確定後才鎖定出題。' : '。')),
      buttons, msg,
      h('table', { class: 'review paper-questions' },
        h('thead', {}, h('tr', {}, h('th', {}, draft ? all : ''), h('th', {}, '主題'), h('th', {}, '難度'), h('th', {}, '題型'), h('th', {}, '題目（點開看答案）'))),
        h('tbody', {}, g.questions.map((q) => h('tr', { 'data-qid': q.id },
          h('td', {}, draft ? h('input', { type: 'checkbox', class: 'pick', 'data-qid': q.id, 'aria-label': `選取 ${q.id}` }) : ''),
          h('td', {}, stageShort(q.stage)), h('td', {}, DIFFICULTY_NAMES[q.difficulty] || '—'),
          h('td', {}, q.qtype === 'short' ? '情境簡答' : '選擇'), h('td', {}, detail(q)))))));
  } catch (e) { showError(panel, e); }
}

async function showReview(attemptId = null) {
  activate('review');
  const selStage = h('select', { id: 'r-stage', 'aria-label': '主題' }, h('option', { value: '' }, '全部主題'),
    ...[1, 2, 3, 4, 5, 6, 7, 8, 9].map((s) => h('option', { value: s }, stageLabel(s))));
  const selDiff = h('select', { id: 'r-diff', 'aria-label': '難度' }, h('option', { value: '' }, '全部難度'),
    ...[1, 2, 3].map((d) => h('option', { value: d }, DIFFICULTY_NAMES[d])));
  const selState = h('select', { id: 'r-state', 'aria-label': '狀態' },
    h('option', { value: 'pending' }, '待審核'), h('option', { value: 'approved' }, '已審核'), h('option', { value: 'removed' }, '已刪除'));
  const list = h('div', {});
  const msg = h('div', { 'aria-live': 'polite' });
  const markBtn = h('button', { class: 'btn', id: 'mark-reviewed' }, '勾選的標為已審核');
  const delBtn = h('button', { class: 'btn ghost', id: 'remove-picked' }, '刪除勾選的題目');
  panel.replaceChildren(
    h('p', { class: 'muted' }, attemptId
      ? '這份考卷用到的題目。確認題目與答案符合好物集 SOP 就「通過」；不適合就「刪除」，刪除只是暫時移出牌堆，牌堆抽完重洗時才會放回。'
      : '新人每次考試都會抽到尚未審核的題目，請在考完後逐題確認：適合的標為已審核，不適合的刪除（刪除＝暫時移出牌堆，牌堆抽完重洗時會放回，資料不歸檔；也可在「已刪除」手動還原）。'),
    attemptId ? h('p', {}, h('a', { href: 'supervisor.html', id: 'back-all' }, '← 回到全部題庫')) : h('div', { class: 'row' }, selStage, selDiff, selState),
    h('div', { class: 'row' }, markBtn, delBtn), msg, list);

  const MAX = 100;
  const stateOf = (q) => (q.removed ? 'removed' : q.reviewed ? 'approved' : 'pending');
  async function load() {
    setBusy(list);
    try {
      let rows;
      if (attemptId) rows = await rpc('list_attempt_questions', { p_attempt: attemptId });
      else {
        const st = selState.value;
        rows = await rpc('list_questions_for_review', {
          p_stage: selStage.value ? Number(selStage.value) : null, p_reviewed: st === 'removed' ? null : st === 'approved',
          p_difficulty: selDiff.value ? Number(selDiff.value) : null, p_removed: st === 'removed' });
      }
      const shown = rows.slice(0, MAX);
      const all = h('input', { type: 'checkbox', 'aria-label': '全選', onchange: (ev) => list.querySelectorAll('input.pick').forEach((c) => (c.checked = ev.target.checked)) });
      const detail = (q) => h('details', {},
        h('summary', {}, q.stem.replace(/\s+/g, ' ').slice(0, 60)),
        h('p', { class: 'stem' }, q.stem),
        q.options ? h('ol', { type: 'A' }, q.options.map((o, i) => h('li', { class: i === q.correct_index ? 'cell-ok' : '' }, o + (i === q.correct_index ? '　✔ 正確答案' : '')))) : null,
        q.reference_answer ? h('p', {}, `參考答案：${q.reference_answer}`) : null,
        q.rubric ? h('p', {}, `得分點：${q.rubric.join('；')}`) : null,
        q.explanation ? h('p', { class: 'muted' }, `解析：${q.explanation}`) : null);
      const act = async (fn, ids, text) => {
        try { const n = await rpc(fn, { p_ids: ids, ...(fn === 'set_reviewed' ? { p_reviewed: true } : {}) }); msg.replaceChildren(h('p', { class: 'notice ok' }, `${text} ${n} 題。`)); await load(); }
        catch (e) { showError(msg, e); }
      };
      const stateLabel = { pending: '待審核', approved: '已審核', removed: '已刪除' };
      list.replaceChildren(
        h('p', { class: 'muted' }, `共 ${rows.length} 題${rows.length > MAX ? `，目前顯示前 ${MAX} 題（可用篩選縮小範圍）` : ''}。`),
        h('table', { class: 'review', 'data-stage': selStage.value },
          h('thead', {}, h('tr', {}, h('th', {}, all), h('th', {}, '主題'), h('th', {}, '難度'), h('th', {}, '題型'), h('th', {}, '題目（點開看答案）'), h('th', {}, '狀態'), h('th', {}, '操作'))),
          h('tbody', {}, shown.map((q) => h('tr', { 'data-qid': q.id },
            h('td', {}, h('input', { type: 'checkbox', class: 'pick', 'data-qid': q.id, 'aria-label': `選取 ${q.id}` })),
            h('td', {}, stageShort(q.stage)), h('td', {}, DIFFICULTY_NAMES[q.difficulty] || '—'),
            h('td', {}, q.qtype === 'short' ? '情境簡答' : '選擇'), h('td', {}, detail(q)), h('td', {}, stateLabel[stateOf(q)]),
            h('td', {},
              q.removed
                ? h('button', { class: 'btn ghost restore-one', onclick: () => act('restore_questions', [q.id], '已還原') }, '還原')
                : [q.reviewed ? null : h('button', { class: 'btn approve-one', onclick: () => act('set_reviewed', [q.id], '已標為已審核') }, '通過'),
                   h('button', { class: 'btn ghost remove-one', onclick: () => { if (confirm('確定刪除這題？刪除後暫時不會被抽到，牌堆抽完重洗時才會放回。')) act('remove_questions', [q.id], '已刪除'); } }, '刪除')]))))));
    } catch (e) { showError(list, e); }
  }
  [selStage, selDiff, selState].forEach((el) => el.addEventListener('change', load));
  const picked = () => [...list.querySelectorAll('input.pick:checked')].map((c) => c.dataset.qid);
  markBtn.addEventListener('click', async () => {
    const ids = picked();
    if (!ids.length) { msg.replaceChildren(h('p', { class: 'notice warn' }, '請先勾選要標記的題目。')); return; }
    try {
      const n = await rpc('set_reviewed', { p_ids: ids, p_reviewed: true });
      msg.replaceChildren(h('p', { class: 'notice ok' }, `已將 ${n} 題標為已審核。`));
      await load();
    } catch (e) { showError(msg, e); }
  });
  delBtn.addEventListener('click', async () => {
    const ids = picked();
    if (!ids.length) { msg.replaceChildren(h('p', { class: 'notice warn' }, '請先勾選要刪除的題目。')); return; }
    if (!confirm(`確定刪除 ${ids.length} 題？刪除後暫時不會被抽到，牌堆抽完重洗時才會放回。`)) return;
    try {
      const n = await rpc('remove_questions', { p_ids: ids });
      msg.replaceChildren(h('p', { class: 'notice ok' }, `已刪除 ${n} 題。`));
      await load();
    } catch (e) { showError(msg, e); }
  });
  await load();
}

async function showAdd() {
  activate('add');
  const ta = h('textarea', { id: 'roster', 'aria-label': '員工名單', style: 'min-height:180px',
    placeholder: '一行一位：姓名,信箱\n例如：\n陳宥廷,chen@example.com\n林小美,mei@example.com\n（也可以直接從 Excel 貼上姓名、信箱兩欄）' });
  const errBox = h('div', { class: 'roster-errors', 'aria-live': 'polite' });
  const out = h('div', {});
  const btn = h('button', { class: 'btn', id: 'create' }, '建立帳號');
  panel.replaceChildren(
    h('p', { class: 'muted' }, '貼上要建立的員工名單，系統會替每人建立帳號並產生一組初始密碼。新帳號一律是「員工」身分。'),
    ta, h('p', {}, btn), errBox, out);

  function renderResults(results) {
    const okRows = results.filter((r) => r.ok);
    const csv = '\uFEFF姓名,信箱,初始密碼\n' + okRows.map((r) => `${r.name},${r.email},${r.password}`).join('\n') + '\n';
    const copy = h('button', { class: 'btn ghost', id: 'copy-all', onclick: async () => {
      try { await navigator.clipboard.writeText(okRows.map((r) => `${r.name}\t${r.email}\t${r.password}`).join('\n')); copy.textContent = '已複製'; }
      catch { copy.textContent = '複製失敗，請改用下載'; }
    } }, '複製全部');
    const dl = h('a', { class: 'btn ghost', id: 'download-csv', download: '新增員工密碼.csv',
      href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })) }, '下載 CSV');
    out.replaceChildren(
      h('p', { class: 'notice warn' }, `建立成功 ${okRows.length} 位，未建立 ${results.length - okRows.length} 位。初始密碼只會顯示這一次，請立刻複製或下載並交給員工；之後只能重設。`),
      h('table', { class: 'created' },
        h('thead', {}, h('tr', {}, ['姓名', '信箱', '初始密碼', '結果'].map((t) => h('th', {}, t)))),
        h('tbody', {}, results.map((r) => h('tr', {},
          h('td', {}, r.name), h('td', {}, r.email),
          h('td', { class: 'pw', style: 'font-family:monospace' }, r.ok ? r.password : '—'),
          h('td', { class: r.ok ? 'cell-ok' : 'cell-bad' }, r.ok ? '已建立' : createErrorLabel(r.error)))))),
      okRows.length ? h('p', { class: 'row' }, copy, dl) : null);
  }

  btn.addEventListener('click', async () => {
    const { users, errors } = parseRoster(ta.value);
    errBox.replaceChildren(errors.length
      ? h('div', { class: 'notice warn' }, h('strong', {}, '這些行無法使用，已略過：'),
          h('ul', {}, errors.map((e) => h('li', {}, `第 ${e.line} 行「${e.text}」：${e.reason}`))))
      : h('span', {}));
    if (!users.length) { out.replaceChildren(h('p', { class: 'notice warn' }, '沒有可以建立的員工。')); return; }
    btn.disabled = true;
    out.replaceChildren(h('p', { class: 'muted' }, '建立中…'));
    try { renderResults((await callFn('create-employees', { action: 'create', users })).results); }
    catch (e) { showError(out, e); }
    finally { btn.disabled = false; }
  });
}

tabAdd.addEventListener('click', showAdd);
tabOverview.addEventListener('click', showOverview);
tabReview.addEventListener('click', () => showReview());
tabPapers.addEventListener('click', () => showPapers());
const reviewParam = new URLSearchParams(location.search).get('review');
if (reviewParam && /^[0-9a-f-]{36}$/i.test(reviewParam)) await showReview(reviewParam);
else await showOverview();
