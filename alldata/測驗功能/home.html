<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考核系統｜首頁｜巷口服務所</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main>
  <p class="cap">第 1 格・考核大廳</p>
  <h1>我的考核</h1>
  <div id="app"></div>
</main>
<script type="module">
import { requireRole } from './js/guard.js';
import { renderNav, h, showError, setBusy } from './js/ui.js';
import { select, rpc } from './js/api.js';
import { stageLabel, statusOf, dueStatus, levelLabel } from './js/format.js';

const me = await requireRole('employee');
renderNav(me, 'home.html');
const app = document.getElementById('app');
setBusy(app);
try {
  const [rows, cfgRows, schedRows, papers] = await Promise.all([
    select('v_stage_summary', { columns: 'stage, best_score, attempts, passed' }),
    select('v_assessments', { columns: 'stage, total_questions, pass_score, active' }),
    select('v_exam_schedule', { columns: 'hire_date, due_1, due_3, due_6, level, passed_1, passed_2, passed_3' }),
    rpc('my_papers', {}),
  ]);
  const ready = new Set(papers.map((p) => p.stage));
  const by = new Map(rows.map((r) => [r.stage, r]));
  const cfg = new Map(cfgRows.map((c) => [c.stage, c]));
  const sc = schedRows[0] || {};
  const card = (stage, due, passed) => {
    const s = by.get(stage);
    const c = cfg.get(stage);
    const cls = !s ? 'none' : s.passed ? 'ok' : 'bad';
    return h('div', { class: 'card stage-card', 'data-stage': stage },
      h('h2', { style: 'margin-top:0' }, stageLabel(stage)),
      h('p', {}, h('span', { class: `badge ${cls}` }, statusOf(s))),
      h('p', { class: 'muted' }, `${c ? `${c.total_questions} 題・${c.pass_score} 分通過・` : ''}${s ? `最高 ${s.best_score} 分・已考 ${s.attempts} 次` : '尚未考過'}`),
      due ? h('p', { class: `due ${due.level}` }, due.label) : null,
      !passed && s && due && due.level === 'overdue' ? h('p', { class: 'due overdue' }, '階段認證待補強') : null,
      ready.has(stage)
        ? h('a', { class: 'btn', href: `exam.html?stage=${stage}` }, '開始考試')
        : h('p', { class: 'muted not-ready' }, '尚未出題：主管審核並鎖定考卷後，這裡才會出現「開始考試」。'));
  };
  app.replaceChildren(
    h('p', { class: 'muted', id: 'level' }, `目前等級：${levelLabel(sc.level)}（依到職日自動變更，不受考核結果影響；升等不增加退款、補償或其他操作權限）`),
    h('h2', {}, '三階段考核'),
    h('p', { class: 'muted' }, '以到職日為準，滿 1、3、6 個月的同日考核（沒有同日採月底，遇假日順延到下一個工作日）。每次 20 題，由題庫依難度隨機抽題，經主管審核、鎖定後才開放作答。紅線題答錯不能用其他題的高分抵銷。'),
    h('div', { class: 'grid', id: 'formal' },
      card(12, dueStatus(sc.due_1, !!sc.passed_1), sc.passed_1),
      card(13, dueStatus(sc.due_3, !!sc.passed_2), sc.passed_2),
      card(14, dueStatus(sc.due_6, !!sc.passed_3), sc.passed_3)));
} catch (e) { showError(app, e); }
</script>
</body>
</html>
